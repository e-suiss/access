# F-13

title = "Access gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and third-party files"
paths = [
    '''(^|/)target/''',
    '''(^|/)node_modules/''',
    '''(^|/)Cargo\.lock$''',
    '''(^|/)package-lock\.json$''',
    '''^supply-chain/imports\.lock$''',
]

[[allowlists]]
description = "Test JWTs signed with public test keys (CR-56 vectors); other rules still apply here"
targetRules = ["jwt"]
paths = [
    '''^conformance/vectors/.+\.json$''',
]
