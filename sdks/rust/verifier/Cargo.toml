[package]
name = "esuiss-access-verifier"
description = "Access offline verifier SDK: Portable Authority Proofs, ValidityContracts, Verifier Profiles and Offline Exercise Reports on the open Kernel (§9.10, §9.12, OP-150)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "access_verifier"

[features]
# OP-150 m.1 (b): emulated clock and counter for tests without hardware
testing = []

[dependencies]
# OP-150 (c)
access-kernel = { workspace = true }
suiss-crypto = { workspace = true, features = ["verify"] }
thiserror = { workspace = true }
# OP-150 m.6 (d)
miniz_oxide = { workspace = true }

[dev-dependencies]
esuiss-access-verifier = { path = ".", features = ["testing"] }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
