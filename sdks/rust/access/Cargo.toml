[package]
name = "esuiss-access-sdk"
description = "Access SDK for Rust: `auth` (OIDC relying party, DPoP, refresh single-flight), `authorize` (the PEP and resource server side of an Access decision) and `mcp` (an MCP resource server as a domain PEP), fail-closed (CMP-17, OP-150, OP-151, OP-154)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "access_sdk"

[features]
default = []
# OP-151 m.3 (g): the refresh single-flight and the in-memory replay store need a lock
std = []
# OP-154 m.3 (v): the MCP resource server; `requestState` is AES-256-GCM from aws-lc-rs
mcp = ["std", "suiss-crypto/aead"]

[dependencies]
# OP-150 m.3 (c)
access-kernel = { workspace = true }
suiss-crypto = { workspace = true, features = ["verify"] }
thiserror = { workspace = true }
# OP-150 m.6 (d)
miniz_oxide = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "sync"] }
axum = { workspace = true, features = ["http1", "tokio"] }
# the integration tests use the `std` and `mcp` modules
esuiss-access-sdk = { path = ".", features = ["std", "mcp"] }

# OP-154 m.3 (v): the reference MCP resource server
[[example]]
name = "mcp_reference"
required-features = ["mcp"]

[lints]
workspace = true
