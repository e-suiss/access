# SA-59

# OP-69: the PKCS#11 tests initialise tokens with softhsm2-util in one shared store, and
# concurrent initialisations race; they run one at a time
[test-groups]
softhsm = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(esuiss-crypto) and test(pkcs11::)'
test-group = 'softhsm'

[profile.default]
# SA-59
retries = 0

# F-8
[profile.ci]
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
