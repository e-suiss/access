# SA-59

experimental = ["wrapper-scripts"]

# OP-69: every test process that loads SoftHSM gets a token store of its own
[scripts.wrapper.softhsm-store]
command = { command-line = "scripts/softhsm-process.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = 'package(esuiss-crypto) | package(access-server) | package(access-signer) | package(access-identity-signer-bin)'
run-wrapper = 'softhsm-store'

[profile.default]
# SA-59
retries = 0

# F-8
[profile.ci]
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# OP-158 m.3 (n): the failover tests share one replicated cell (scripts/pg-ha.sh)
[test-groups]
pg-ha = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(pg_ha)'
test-group = 'pg-ha'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(pg_ha)'
test-group = 'pg-ha'
slow-timeout = { period = "60s", terminate-after = 5 }
