[package]
name = "access-executor"
description = "Access Executor (B21, AG-40): runs an agent's allowed Exercises durably, step by step, and reports each effect as a Claim; it decides nothing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "access-executor"
path = "src/main.rs"

[features]
default = []
# throwaway executor databases for this crate's and other crates' tests
testing = []

[dependencies]
# OP-154 m.3 (u), OP-62
access-kernel = { workspace = true }
access-sdk = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
httparse = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate"] }
suiss-crypto = { workspace = true, features = ["signer", "aead"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[dev-dependencies]
access-executor = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
