[package]
name = "access-experience"
description = "Experience backend (CMP-16): the Authority hub's render data, read from Access's public endpoints with the caller's own AIS; it holds and writes no authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "access-experience"
path = "src/main.rs"

[dependencies]
# OP-153 m.3 (v), OP-62
access-kernel = { workspace = true }
access-sdk = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
futures-util = { workspace = true }
httparse = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true, features = ["verify"] }
suiss-ledger = { workspace = true, features = ["doorbell"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[dev-dependencies]
suiss-ledger = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
