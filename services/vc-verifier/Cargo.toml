[package]
name = "access-vc-verifier"
description = "OID4VP verifier service: SD-JWT VC and mdoc presentations under the HAIP profile, checked against trusted lists and sent to Claim Ingest as Claims; it holds and writes no authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[[bin]]
name = "access-vc-verifier"
path = "src/main.rs"

[features]
default = []
# throwaway verifier databases for this crate's and other crates' tests
testing = []

[dependencies]
# OP-155 m.3 (p), OP-62
access-kernel = { workspace = true }
access-sdk = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
httparse = { workspace = true, features = ["std"] }
miniz_oxide = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
rustls-webpki = { workspace = true, features = ["aws-lc-rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate"] }
suiss-crypto = { workspace = true, features = ["signer", "aead"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[dev-dependencies]
access-vc-verifier = { path = ".", features = ["testing"] }
aws-lc-rs = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
