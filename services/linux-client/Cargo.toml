[package]
name = "access-linux-client"
description = "The Access Linux client: the access-linuxd daemon and its NSS and PAM modules for console sign-in and sudo step-up, with an offline cache bound to the host's horizon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[[bin]]
name = "access-linuxd"
path = "src/main.rs"

[dependencies]
# OP-156 m.3 (p), OP-62: public crates only
access-kernel = { workspace = true }
access-sdk = { workspace = true, features = ["std"] }
access-verifier = { workspace = true }
access-linux-module = { path = "module" }
httparse = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true, features = ["signer"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["std", "event"] }

[dev-dependencies]
access-verifier = { workspace = true, features = ["testing"] }
ed25519-dalek = { workspace = true }
miniz_oxide = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true, features = ["verify"] }

[lints]
workspace = true
