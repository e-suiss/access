[package]
name = "access-mcp-gateway"
description = "Access Proxy in MCP mode: an MCP-aware enforcement point that asks Access before every tool call and pins each server's tool list; it holds no authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[[bin]]
name = "access-mcp-gateway"
path = "src/main.rs"

[dependencies]
# OP-156 m.3 (n), OP-62: public crates only
access-kernel = { workspace = true }
access-sdk = { workspace = true, features = ["std", "mcp"] }
axum = { workspace = true, features = ["http1", "tokio"] }
httparse = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
suiss-crypto = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }

[lints]
workspace = true
