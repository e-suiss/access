[package]
name = "access-hr-connector"
description = "HR connectors outside the Access core: they pull records from an HR system and push them to Access's HR batch API with public crates only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[[bin]]
name = "access-hr-connector"
path = "src/main.rs"

[features]
default = []
# throwaway connector databases for this crate's and other crates' tests
testing = []

[dependencies]
# OP-156 m.3 (q), OP-62: public crates only
access-kernel = { workspace = true }
access-sdk = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
httparse = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate"] }
suiss-crypto = { workspace = true, features = ["signer"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[dev-dependencies]
access-hr-connector = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
