# SA-23, OP-68, §14.5
name: Weekly

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak, thread]
    services:
      # OP-66
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned sanitizer toolchain from the justfile
        id: nightly
        run: |
          toolchain="$(sed -n 's/^sanitizer_nightly := "\(.*\)"$/\1/p' justfile)"
          test -n "$toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          cache-key: sanitizer-${{ matrix.sanitizer }}
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: rust-src
      # OP-69, OP-140 m.4
      - name: SoftHSM
        run: scripts/ci/apt-install.sh softhsm2
      - name: Test suite under the sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: just sanitize "$SANITIZER"
      # R-2, SA-20, OP-159 m.3 (dd)
      - name: Miri on the Kernel, the parsers and the pure verifier
        if: matrix.sanitizer == 'address'
        env:
          NIGHTLY: ${{ steps.nightly.outputs.toolchain }}
        run: |
          rustup component add miri --toolchain "$NIGHTLY"
          just miri

  # OP-155 m.3 (o), RR-28: the Kerberos C FFI under AddressSanitizer, and the ASN.1 fuzz target
  # of the Negotiate token reader the parser worker runs; sanitizers run in the weekly job (SA-23)
  kerberos-asan:
    name: kerberos-asan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned sanitizer toolchain from the justfile
        id: toolchain
        run: echo "nightly=$(sed -n 's/^sanitizer_nightly := "\(.*\)"$/\1/p' justfile)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          cache-key: kerberos-asan
          toolchain: ${{ steps.toolchain.outputs.nightly }}
          components: rust-src
      - name: MIT Kerberos headers, libclang and cargo-fuzz
        run: |
          scripts/ci/apt-install.sh libkrb5-dev libclang-dev
          cargo install --locked cargo-fuzz --version 0.13.1
      - name: Kerberos gateway tests under AddressSanitizer
        working-directory: bins/access-gw-kerberos
        env:
          RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
          RUSTDOCFLAGS: -Zsanitizer=address
          NIGHTLY: ${{ steps.toolchain.outputs.nightly }}
        run: cargo "+$NIGHTLY" test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests
      - name: Fuzz the Negotiate token reader (ASan)
        run: just fuzz spnego_read 600

  checksec-release:
    name: checksec-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          tools: auditable
      # SA-23, §14.5
      - name: Release build
        run: just release-build x86_64-unknown-linux-gnu
      - name: Hardening assertion
        run: just checksec target/x86_64-unknown-linux-gnu/release/access-server
