# OP-68, SA-59, OP-80, OP-69, OP-71
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      - name: Format (OP-64)
        run: just fmt-check
      - name: Clippy, warnings are errors (OP-64)
        run: just lint
      - name: Repository rules (OP-62, OP-3, OP-66)
        run: just rules
      - name: CI script tests (F-14)
        run: just ci-scripts-test
      # CR-39 m.5, SA-T13
      - name: Constant-time comparison assembly snapshot (difference = review)
        run: just ct-asm

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      # OP-66, SA-59
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
      # the workspace test build outgrew the runner's disk with full debug info
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      # OP-69, OP-140 m.4: the PKCS#11 key store is tested against SoftHSM
      - name: SoftHSM
        run: sudo apt-get install --yes --no-install-recommends softhsm2
      - name: Tests (SA-59 phase 0 layers)
        run: just test
      # OP-116 m.6
      - name: Kernel vectors through the uniffi Python binding
        run: just uniffi-test
      - name: Binary hardening (SA-23, §14.5)
        run: |
          cargo build --locked -p access-server
          just checksec target/debug/access-server

  # OP-66: the committed .sqlx metadata matches every query against the migrated schema
  # SA-59, OP-152 m.5 (c): diff-scoped mutation testing of the Kernel and the authority core's
  # decision paths; a missed or timed-out mutant fails
  mutants-diff:
    name: mutants-diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest mutants
      - name: Mutants on the changed lines
        run: just mutants-diff "origin/$BASE_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-diff-${{ github.run_id }}
          path: mutants.out
          retention-days: 30
          if-no-files-found: ignore

  sqlx:
    name: sqlx
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: sqlx
          tools: sqlx
      - name: Offline query metadata is current (cargo sqlx prepare --check)
        run: just sqlx-check

  # OP-105
  smt:
    name: smt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      # OP-115 m.6
      - name: Restriction change analysis with the pinned cvc5 in its sandbox (OP-105, F-2)
        run: just smt-test
      - name: Seccomp kills reported by the kernel
        if: failure()
        run: sudo dmesg | grep -E 'type=1326|seccomp' || true
      - name: Parser worker prctl trace
        if: failure()
        run: |
          sudo apt-get install --yes --no-install-recommends strace
          bin="$(cargo test --locked -p access-parser-worker --test worker --no-run --message-format=json | jq -r 'select(.executable != null and .target.name == "worker") | .executable')"
          sudo strace -f -e trace=prctl,prlimit64,setrlimit,execve,seccomp -o "$RUNNER_TEMP/worker.strace" "$bin" --ignored --test-threads=1 limits_refuse_before_parsing || true
          grep -v 'PR_CAPBSET_READ' "$RUNNER_TEMP/worker.strace" | tail -150 || true

  # OP-119 m.3, CR-49
  lean:
    name: lean
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # F-2
      - name: Install the pinned Lean toolchain
        run: scripts/lean-fetch.sh "$RUNNER_TEMP/lean" >> "$GITHUB_PATH"
      - name: Build the algebra model and its proofs
        working-directory: conformance/lean
        run: lake build --wfail AccessAlgebra vectors
      - name: No theorem marked proved depends on sorry
        working-directory: conformance/lean
        run: ./check-axioms.sh
      - name: Model against the Kernel algebra vectors
        working-directory: conformance/lean
        run: lake exe vectors ../vectors/core/*/*.json

  cross:
    name: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: cross
          tools: wasmtime
      # OP-104 m.7
      - name: Use the NDK compiler for Android
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android24-clang"
          test -x "$bin/x86_64-linux-android24-clang"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CC_x86_64_linux_android=$bin/x86_64-linux-android24-clang"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"
      # CMP-24, MD-1, T41, OP-116 m.3
      - name: Kernel and uniffi binding cross-compilation
        run: just cross
      # OP-116 m.3
      - name: Android uniffi cdylib links against the NDK sysroot
        run: just android-link-check
      # OP-56, OP-106 m.24
      - name: Vector cross-check with an independent encoder
        working-directory: conformance/vectors/tools/cbor-crosscheck
        run: go run . ../..
      # OP-112, CR-49 m.2
      - name: F0 reference evaluator on the vectors
        run: just f0

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: tools
          tools: deny vet
      - name: cargo-deny (F-1)
        run: just deny
      - name: No rsa crate, cargo tree -i rsa (CR-14, §10.4.5)
        run: just no-rsa
      - name: cargo-vet (F-1)
        run: just vet
      - name: Vendored IDE and hook files are reviewed (F-2, OP-127 m.2)
        run: just vendor
      - name: Published crates package and build alone (OP-76, OP-139)
        run: just crates-package
      - name: Each esuiss-crypto feature builds alone (OP-140 m.4)
        run: just crates-features

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # F-13, F-2
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  sandbox:
    name: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - name: Linux sandbox tests
        run: |
          if [[ ! -f crates/suiss-sandbox/Cargo.toml ]]; then
            echo "::notice::crates/suiss-sandbox does not exist yet; nothing to test"
            exit 0
          fi
          cargo test --locked -p esuiss-sandbox --lib
          cargo test --locked -p esuiss-sandbox --doc
          just test-sandbox
        env:
          ACCESS_SANDBOX_REQUIRE_MEMFD_SECRET: "1"
      # OP-155 m.3 (c), U43
      - name: Parser worker isolation under the Linux lockdown
        run: just test-parser-worker
      - name: Seccomp kills reported by the kernel
        if: failure()
        run: sudo dmesg | grep -E 'type=1326|seccomp' || true
      - name: Parser worker prctl trace
        if: failure()
        run: |
          sudo apt-get install --yes --no-install-recommends strace
          bin="$(cargo test --locked -p access-parser-worker --test worker --no-run --message-format=json | jq -r 'select(.executable != null and .target.name == "worker") | .executable')"
          sudo strace -f -e trace=prctl,prlimit64,setrlimit,execve,seccomp -o "$RUNNER_TEMP/worker.strace" "$bin" --ignored --test-threads=1 limits_refuse_before_parsing || true
          grep -v 'PR_CAPBSET_READ' "$RUNNER_TEMP/worker.strace" | tail -150 || true

  # OP-116 m.6
  uniffi-kotlin:
    name: uniffi-kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - name: Kernel vectors through the uniffi Kotlin binding on the runner JDK (F-2)
        run: |
          java -version
          just uniffi-test-kotlin

  # OP-116 m.6
  uniffi-swift:
    name: uniffi-swift
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: swift
      - name: Kernel vectors through the uniffi Swift binding
        run: |
          swiftc --version
          just uniffi-test-swift

  bench-instructions:
    name: bench-instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: bench
          tools: gungraun
      - name: Install Valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends valgrind
      # OP-72
      - name: Baseline (base commit)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::notice::no base commit; recording the current numbers only"
            echo "HAVE_BASELINE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          git checkout --quiet "$BASE_SHA"
          if [[ -f crates/kernel/benches/kernel_instructions.rs ]]; then
            just bench-instructions --save-baseline=base
            echo "HAVE_BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "HAVE_BASELINE=false" >> "$GITHUB_ENV"
          fi
          # AG-22: the agent token bench has a baseline only once the base has it
          if [[ -f crates/kernel/benches/agent_tokens.rs ]]; then
            echo "HAVE_AGENT_BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "HAVE_AGENT_BASELINE=false" >> "$GITHUB_ENV"
          fi
          git checkout --quiet "$head"
      - name: Kernel regression gate (fails above 5 %)
        run: |
          if [[ "$HAVE_BASELINE" == true ]]; then
            just bench-instructions-one kernel_instructions --baseline=base --callgrind-limits='ir=5%'
          else
            just bench-instructions-one kernel_instructions
          fi
      # AG-22, §11.9.4: the pure cost of an agent's 15-minute token refresh
      - name: Agent token regression gate (fails above 5 %)
        run: |
          if [[ "$HAVE_BASELINE" == true && "$HAVE_AGENT_BASELINE" == true ]]; then
            just bench-instructions-one agent_tokens --baseline=base --callgrind-limits='ir=5%'
          else
            just bench-instructions-one agent_tokens
          fi

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: wasm
          tools: wasm-bindgen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          # OP-97
          cache-dependency-path: |
            sdks/typescript/package-lock.json
            web/console/package-lock.json
            web/login/package-lock.json
            web/components/package-lock.json
            web/account/package-lock.json
      - name: Install (lockfile only, no install scripts)
        run: just web-install
      - name: Lint, type check, format (OP-83)
        run: just web-check
      # OP-151 m.3 (g)
      - name: Generated SDK types match the OpenAPI contracts
        run: just sdk-types-check
      # OP-116 m.6
      - name: Unit tests and Kernel vectors through the Wasm binding
        run: just web-test
      - name: Keep the Wasm build for the browser tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-wasm
          path: sdks/typescript/wasm
          retention-days: 1
          if-no-files-found: error

  # OP-151 m.3 (g), T41 item 6: every Kernel binding passes the conformance vectors
  bindings-gate:
    name: bindings-gate
    needs: [test, uniffi-kotlin, uniffi-swift, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Binding compatibility row
        run: |
          {
            echo "| Kernel | Bindings that passed the vectors | Vector set |"
            echo "|---|---|---|"
            just bindings-row
          } >> "$GITHUB_STEP_SUMMARY"

  web-e2e:
    name: web-e2e
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            sdks/typescript/package-lock.json
            web/console/package-lock.json
            web/login/package-lock.json
            web/components/package-lock.json
            web/account/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-wasm
          path: sdks/typescript/wasm
      - name: Browser end-to-end, visual and WCAG 2.2 AA tests
        run: |
          (cd sdks/typescript && npm ci)
          cd web/console
          npm ci
          npm run e2e
      # OP-146 m.4 (g), TN-106
      - name: Hosted login end-to-end, passkey (virtual authenticator), CSP and WCAG 2.2 AA tests
        run: |
          cd web/login
          npm ci
          npm run e2e
      # OP-153 m.3 (w): the account shell and the Authority hub over a mocked BFF
      - name: Account pages end-to-end
        run: |
          (cd web/components && npm ci)
          cd web/account
          npm ci
          npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/console/playwright-report
            web/login/playwright-report
            web/account/playwright-report
          retention-days: 7

  # OP-155 m.3 (n), (q), Ek B 4664: the edge gateways against their counterparts (OpenLDAP and its
  # command-line clients, an MIT KDC, FreeRADIUS radclient); containers pinned by digest
  edge-interop:
    name: edge-interop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      - name: OpenLDAP clients and radclient
        run: sudo apt-get install --yes --no-install-recommends ldap-utils freeradius-utils
      - name: OpenLDAP, MIT KDC and FreeRADIUS
        run: scripts/ci/edge-env.sh up
      - name: LDAP gateway against the OpenLDAP clients
        run: cargo nextest run --locked -p access-gw-ldap --test interop --run-ignored only
      - name: AD sync from OpenLDAP
        run: cargo nextest run --locked -p access-identity-directory --run-ignored only
      - name: RADIUS gateway against radclient over UDP
        run: cargo nextest run --locked -p access-gw-radius --test interop --run-ignored only
      - name: Stop the counterparts
        if: always()
        run: scripts/ci/edge-env.sh down

  # OP-155 m.3 (o), RR-28: the Kerberos gateway's own workspace (lint, tests, cargo-deny,
  # cargo-vet), then SPNEGO end to end against an MIT KDC with the gateway and the parser worker
  # as real processes
  kerberos:
    name: kerberos
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: kerberos
          tools: deny vet
      - name: MIT Kerberos headers and clients, libclang for the bindings
        run: sudo apt-get install --yes --no-install-recommends libkrb5-dev krb5-user libclang-dev jq curl
      - name: OpenLDAP, MIT KDC and FreeRADIUS
        run: scripts/ci/edge-env.sh up
      - name: Kerberos workspace and SPNEGO end to end
        run: just kerberos
      - name: Stop the counterparts
        if: always()
        run: scripts/ci/edge-env.sh down

  # OP-68, F-6, F-7: the main image is built, pushed and signed only after every check above passed
  image:
    name: image
    needs:
      - fast
      - test
      - sqlx
      - smt
      - lean
      - cross
      - supply-chain
      - secrets
      - sandbox
      - edge-interop
      - kerberos
      - uniffi-kotlin
      - uniffi-swift
      - bench-instructions
      - web
      - bindings-gate
      - web-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
