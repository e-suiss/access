# OP-68, F-6, F-7, OP-49, OP-69
name: Image

# OP-68: called by CI on main once every check passed, so no image is pushed or signed before
on:
  workflow_call:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/e-suiss/access

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      local: ghcr.io/e-suiss/access@${{ steps.local.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: cosign
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=main-${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          provenance: false
          sbom: false
      # OP-69, OP-149 m.21: the same binaries with SoftHSM and the local provisioning
      - name: Build and push the local image
        id: local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: local
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-local
            ${{ env.IMAGE }}:local
          provenance: false
          sbom: false
      # OP-155 m.3 (o), Ek B 4988: the Kerberos gateway, the only image with libgssapi
      - name: Build and push the Kerberos gateway image
        id: kerberos
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.kerberos
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-gw-kerberos:${{ steps.tag.outputs.tag }}
          provenance: false
          sbom: false
      - name: Sign the images (F-7)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL: ${{ steps.local.outputs.digest }}
          KERBEROS: ${{ steps.kerberos.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST" "$IMAGE@$LOCAL" "$IMAGE-gw-kerberos@$KERBEROS"
      - name: Image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Local image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.local.outputs.digest }}
          push-to-registry: true
      - name: Kerberos gateway image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}-gw-kerberos
          subject-digest: ${{ steps.kerberos.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL: ${{ steps.local.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "### ${IMAGE}:${TAG}-local"
            echo
            echo "\`${IMAGE}@${LOCAL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # CR-15, OP-159 m.28: the release's FIPS image builds on main before any tag asks for it
  fips-image:
    name: fips-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the FIPS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: FIPS=1
          push: false
          provenance: false
          sbom: false

  # OP-156 m.3 (p): the Linux client's package root (access-linuxd, the NSS and PAM modules, the
  # systemd unit), signed and attested like the server images
  linux-client-image:
    name: linux-client-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: cosign
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=main-${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push the Linux client image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/linux-client/Dockerfile
          target: linux-client
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-linux-client:${{ steps.tag.outputs.tag }}
          provenance: false
          sbom: false
      - name: Sign the image (F-7)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE-linux-client@$DIGEST"
      - name: Image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}-linux-client
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # OP-69, OP-149 m.21: the local deployment comes up from the pushed image and serves a product
  local-smoke:
    name: local-smoke
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      ACCESS_IMAGE: ${{ needs.image.outputs.local }}
      COMPOSE: docker compose --file deploy/compose/access.yaml
      # OP-149 m.23: a declared delivery target and its product certificate
      ACCESS_LOCAL_PRODUCT_HOSTS: work-server
      ACCESS_DELIVERY_TARGETS: '[{url="https://work-server:8443/v1/inbound/events", ca_file="/var/lib/access/certs/ca.crt"}]'
      # OP-149 m.26 (b): the bootstrap's test user; this job's own, not a secret
      ACCESS_LOCAL_TEST_PASSWORD: local-smoke-test-user-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # OP-141 m.18 (b): a product's PEP key stays in its token; init signs its CSR
      - name: Product CSR
        run: |
          mkdir -p "$RUNNER_TEMP/products"
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$RUNNER_TEMP/work-pep.key" -subj "/CN=ignored" \
            -out "$RUNNER_TEMP/products/work-pep.csr"
          chmod 0755 "$RUNNER_TEMP/products"
          chmod 0644 "$RUNNER_TEMP/products/work-pep.csr"
          echo "ACCESS_PRODUCT_KEYS=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
      - name: Start
        run: $COMPOSE up --detach --quiet-pull
      - name: Serve
        run: |
          healthy=
          for _ in $(seq 1 60); do
            if $COMPOSE exec -T access-server \
              curl -fsS --cacert /var/lib/access/certs/ca.crt https://localhost:9090/readyz; then
              healthy=1
              break
            fi
            sleep 2
          done
          test -n "$healthy"
          for f in ca.crt pep.crt pep.key; do
            $COMPOSE exec -T access-server cat "/var/lib/access/certs/$f" > "$RUNNER_TEMP/$f"
          done
          $COMPOSE logs --no-color bootstrap
          tls=(-fsS --cacert "$RUNNER_TEMP/ca.crt" --resolve access-server:8443:127.0.0.1)
          curl "${tls[@]}" https://access-server:8443/realms/platform/.well-known/suiss-configuration
          # OP-151 m.3 (b): health is internal only; the management API answers on its own port
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/ca.crt" \
            --resolve access-server:8443:127.0.0.1 https://access-server:8443/healthz)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/ca.crt" \
            --resolve access-server.local:9443:127.0.0.1 https://access-server.local:9443/admin/v1/platform)" = 401
          # OP-151 m.12 (b): the console sends a sign-in to the realm's own authorization server
          test "$(curl -s -o /dev/null -w '%{redirect_url}' --cacert "$RUNNER_TEMP/ca.crt" \
            --resolve access-server.local:9443:127.0.0.1 \
            'https://access-server.local:9443/console/api/sign-in?realm=acme' | cut -d'?' -f1)" \
            = https://access-server:8443/realms/acme/authorize
          curl "${tls[@]}" --cert "$RUNNER_TEMP/pep.crt" --key "$RUNNER_TEMP/pep.key" \
            https://access-server:8443/access/v1/tenants | grep -q '"tnt_'
          $COMPOSE logs --no-color access-server | grep -q 'declared delivery targets'
          $COMPOSE run --rm --no-deps -T --entrypoint openssl init \
            verify -CAfile /var/lib/access/certs/ca.crt /var/lib/access/product-tls/work-server.crt
          $COMPOSE run --rm --no-deps -T --entrypoint cat init \
            /var/lib/access/product-tls/work-pep.crt > "$RUNNER_TEMP/work-pep.crt"
          openssl verify -CAfile "$RUNNER_TEMP/ca.crt" -purpose sslclient "$RUNNER_TEMP/work-pep.crt"
          curl "${tls[@]}" --cert "$RUNNER_TEMP/work-pep.crt" --key "$RUNNER_TEMP/work-pep.key" \
            https://access-server:8443/access/v1/tenants | grep -q '"tnt_'
          $COMPOSE run --rm --no-deps -T init
          $COMPOSE run --rm --no-deps -T --entrypoint cat init \
            /var/lib/access/product-tls/work-pep.crt | cmp - "$RUNNER_TEMP/work-pep.crt"
      - name: Bootstrap again
        run: |
          $COMPOSE run --rm --no-deps -T bootstrap > "$RUNNER_TEMP/again.json"
          grep -q '"created": false' "$RUNNER_TEMP/again.json"
          ! grep -q '"created": true' "$RUNNER_TEMP/again.json"
      # OP-149 m.26 (b), (c), (e), m.32: the headless sign-in with the password and the software
      # passkey, bound to the test user's known device Instance, the sign-in with the passkey
      # alone, and a compromise declaration over the PEP certificate, each against the running
      # deployment
      - name: Local client
        run: |
          client_id="$(jq -r '.test_user.client_id' "$RUNNER_TEMP/again.json")"
          issuer="$(jq -r '.realms[] | select(.slug == "acme") | .issuer' "$RUNNER_TEMP/again.json")"
          instance="$(jq -r '.test_user.instance' "$RUNNER_TEMP/again.json")"
          $COMPOSE run --rm --no-deps -T local-client login \
            --issuer "$issuer" --ca /var/lib/access/certs/ca.crt \
            --client-id "$client_id" --redirect-uri http://127.0.0.1/cb \
            --identifier test@acme.example --password-env BOOTSTRAP_TEST_PASSWORD \
            --passkey access/bootstrap/test-user-passkey \
            --device-key access/bootstrap/test-user-device \
            --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server \
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server > "$RUNNER_TEMP/tokens.json"
          jq -e '.token_type == "DPoP" and (.access_token | length > 0) and (.id_token | length > 0)' "$RUNNER_TEMP/tokens.json"
          jq -e --arg instance "$instance" '.instance == $instance' "$RUNNER_TEMP/tokens.json"
          $COMPOSE run --rm --no-deps -T local-client login \
            --issuer "$issuer" --ca /var/lib/access/certs/ca.crt \
            --client-id "$client_id" --redirect-uri http://127.0.0.1/cb \
            --identifier test@acme.example --passkey access/bootstrap/test-user-passkey \
            --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server \
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server > "$RUNNER_TEMP/passkey-tokens.json"
          jq -e '.token_type == "DPoP" and (.access_token | length > 0)' "$RUNNER_TEMP/passkey-tokens.json"
          domain="$(jq -r '.compromise.domain' "$RUNNER_TEMP/again.json")"
          declarant="$(jq -r '.compromise.issuer' "$RUNNER_TEMP/again.json")"
          party="$(jq -r '.sample.subject' "$RUNNER_TEMP/again.json")"
          $COMPOSE run --rm --no-deps -T local-client compromise \
            --api https://access-server:8443 --ca /var/lib/access/certs/ca.crt \
            --cert /var/lib/access/certs/pep.crt --key /var/lib/access/certs/pep.key \
            --domain "$domain" --issuer-party "$declarant" --party "$party" > "$RUNNER_TEMP/claim.json"
          jq -e '.disposition == "admit"' "$RUNNER_TEMP/claim.json"
      # OP-149 m.29 (b): an allowed Exercise end to end on the hosted Approval Surface, as the
      # product's PEP; the receipt verifies against the domain's published metadata
      - name: Local approval
        run: |
          now="$(date +%s)000"
          intent="$(jq -c --argjson now "$now" '.test_user.allowed | {
            action: .action,
            resources: [{ namespace: .resource.namespace, path: [(.resource.path_prefix + "local-smoke")] }],
            params: { ledger: { eq: "main" }, declaration: { eq: { bytes: "0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dE" } } },
            validity: { from: ($now - 60000), until: ($now + 600000) } }' "$RUNNER_TEMP/again.json")"
          read -r issuer domain party instance grant since cgrant csince < <(jq -r '.test_user as $u | [
            (.realms[] | select(.slug == "acme") | .issuer), $u.allowed.domain, $u.party, $u.instance,
            $u.allowed.basis.holding.grant, $u.allowed.basis.holding.since,
            $u.allowed.contribution.basis.holding.grant, $u.allowed.contribution.basis.holding.since] | @tsv' "$RUNNER_TEMP/again.json")
          $COMPOSE run --rm --no-deps -T local-client approve \
            --issuer "$issuer" --api https://access-server:8443 --ca /var/lib/access/certs/ca.crt \
            --cert /var/lib/access/certs/pep.crt --key /var/lib/access/certs/pep.key \
            --redirect-uri http://127.0.0.1/cb --identifier test@acme.example \
            --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server \
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server \
            --device-key access/bootstrap/test-user-device --passkey access/bootstrap/test-user-passkey \
            --domain "$domain" --party "$party" --instance "$instance" \
            --grant "$grant" --grant-since "$since" --contribute-grant "$cgrant" --contribute-since "$csince" \
            --intent-json "$intent" > "$RUNNER_TEMP/approved.json"
          jq -e '.receipt.verified == true and .render_digest_verified == true and (.exercise | length > 0)' "$RUNNER_TEMP/approved.json"
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes

  # AG-17, SA-43, §11.8.2, OP-154 m.3 (gg): the pinned MCP conformance suite against the local
  # deployment's authorization server, and the reference MCP resource server of the Rust SDK
  # against the same deployment; beside the OIDF suite and the Access vectors, never instead
  mcp-conformance:
    name: mcp-conformance
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      ACCESS_IMAGE: ${{ needs.image.outputs.local }}
      COMPOSE: docker compose --file deploy/compose/access.yaml
      # OP-149 m.26 (b): the bootstrap's test user; this job's own, not a secret
      ACCESS_LOCAL_TEST_PASSWORD: mcp-conformance-test-user-password
      MCP_PORT: "8787"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: mcp-conformance
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: conformance/mcp/package-lock.json
      # F-1, F-2, OP-83: the suite's exact version and every dependency's integrity from the lockfile
      - name: Install the pinned suite
        working-directory: conformance/mcp
        run: npm ci --ignore-scripts
      - name: Build the reference MCP resource server
        run: cargo build --locked -p esuiss-access-sdk --features mcp --example mcp_reference
      - name: Start
        run: $COMPOSE up --detach --quiet-pull
      - name: Ready
        run: |
          for _ in $(seq 1 60); do
            if $COMPOSE exec -T access-server \
              curl -fsS --cacert /var/lib/access/certs/ca.crt https://localhost:9090/readyz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Deployment
        run: |
          echo "127.0.0.1 access-server" | sudo tee -a /etc/hosts
          mkdir -p "$RUNNER_TEMP/mcp"
          for f in ca.crt pep.crt pep.key; do
            $COMPOSE exec -T access-server cat "/var/lib/access/certs/$f" > "$RUNNER_TEMP/mcp/$f"
          done
          $COMPOSE run --rm --no-deps -T bootstrap > "$RUNNER_TEMP/mcp/summary.json"
          issuer="$(jq -er '.realms[] | select(.slug == "acme") | .issuer' "$RUNNER_TEMP/mcp/summary.json")"
          test "$issuer" = https://access-server:8443/realms/acme
          echo "MCP_ISSUER=$issuer" >> "$GITHUB_ENV"
      # §11.8.2, AG-17: the authorization server's metadata as an MCP client discovers it
      - name: MCP conformance, authorization server
        working-directory: conformance/mcp
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/mcp/ca.crt
        run: >-
          npx --no-install conformance authorization
          --url "$MCP_ISSUER"
          --scenario authorization-server-metadata-endpoint
          --output-dir "$RUNNER_TEMP/mcp/results"
      # AG-16, §11.5, OP-154 m.6 (k): the reference resource server on the deployment's realm
      - name: Start the reference MCP resource server
        run: |
          dir="$RUNNER_TEMP/mcp"
          domain="sha-256:$(jq -er '.realms[] | select(.slug == "acme") | .domain' "$dir/summary.json")"
          curl -fsS --max-time 10 --cacert "$dir/ca.crt" -o "$dir/metadata.cose" \
            "https://access-server:8443/.well-known/access-domain-metadata/$domain"
          jq -e '.sample.realm == "acme"' "$dir/summary.json"
          jq '[.sample | {
            name: "approve",
            action: (.action | .schema = ("sha-256:" + .schema)),
            resource: .resource,
            scopes: ["work.approve"]
          }]' "$dir/summary.json" > "$dir/tools.json"
          MCP_RESOURCE="http://127.0.0.1:$MCP_PORT/mcp" \
          MCP_BIND="127.0.0.1:$MCP_PORT" \
          MCP_PEP=mcp-reference \
          MCP_TOOLS="$dir/tools.json" \
          MCP_ORIGINS= \
          ACCESS_ISSUER="$MCP_ISSUER" \
          ACCESS_API=https://access-server:8443 \
          ACCESS_DOMAIN="$domain" \
          ACCESS_METADATA="$dir/metadata.cose" \
          ACCESS_APPROVAL="$MCP_ISSUER/approve" \
          ACCESS_CA="$dir/ca.crt" MCP_CERT="$dir/pep.crt" MCP_KEY="$dir/pep.key" \
            nohup target/debug/examples/mcp_reference > "$dir/rs.log" 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null \
              "http://127.0.0.1:$MCP_PORT/.well-known/oauth-protected-resource/mcp"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$dir/rs.log"
            exit 1
          fi
          # RS-M1, RS-M3, RS-M15, §11.5.2, §11.5.6 #20, #25
          base="http://127.0.0.1:$MCP_PORT"
          rpc='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}'
          curl -fsS --max-time 5 -o "$dir/prm.json" "$base/.well-known/oauth-protected-resource/mcp"
          jq -e --arg issuer "$MCP_ISSUER" --arg resource "$base/mcp" \
            '.resource == $resource and .authorization_servers == [$issuer]' "$dir/prm.json"
          status="$(curl -sS --max-time 5 -o /dev/null -D "$dir/challenge.txt" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' --data "$rpc" "$base/mcp")"
          test "$status" = 401
          grep -i '^www-authenticate: Bearer' "$dir/challenge.txt" | grep -q "resource_metadata=\"$base/.well-known/oauth-protected-resource/mcp\""
          host="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -H 'Host: evil.example' --data "$rpc" "$base/mcp")"
          test "$host" = 403
          origin="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -H 'Origin: http://evil.example' --data "$rpc" "$base/mcp")"
          test "$origin" = 403
      - name: Logs
        if: failure()
        run: |
          $COMPOSE logs --no-color
          cat "$RUNNER_TEMP/mcp/rs.log" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mcp-conformance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mcp/results
            ${{ runner.temp }}/mcp/prm.json
            ${{ runner.temp }}/mcp/challenge.txt
            ${{ runner.temp }}/mcp/rs.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes

  # OP-153 m.3 (gg): the web pages' @live tests against the local deployment, from the pushed
  # image, signed in as the bootstrap's test user
  web-live:
    name: web-live
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      ACCESS_IMAGE: ${{ needs.image.outputs.local }}
      COMPOSE: docker compose --file deploy/compose/access.yaml
      # OP-149 m.26 (b): the bootstrap's test user; this job's own, not a secret
      ACCESS_LOCAL_TEST_PASSWORD: web-live-test-user-password
      ACCESS_LIVE_ORIGIN: https://access-server:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # OP-159 m.32: pnpm at the version and hash web/package.json pins
      - name: Install the web workspace
        run: |
          corepack enable
          cd web && pnpm install --frozen-lockfile
      - name: Start
        run: $COMPOSE up --detach --quiet-pull
      - name: Ready
        id: ready
        run: |
          for _ in $(seq 1 60); do
            if $COMPOSE exec -T access-server \
              curl -fsS --cacert /var/lib/access/certs/ca.crt https://localhost:9090/readyz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      # OP-149 m.26 (b): the realm asks the test user for a second factor; the browser tests answer
      # it with a code of the authenticator app whose seed the bootstrap kept in its volume
      - name: Test user's authenticator app
        id: totp
        run: |
          seed="$($COMPOSE run --rm --no-deps -T --entrypoint cat bootstrap /var/lib/access/bootstrap/test-user-totp)"
          echo "::add-mask::$seed"
          test -n "$seed"
          echo "ACCESS_LIVE_TEST_TOTP_SEED=$seed" >> "$GITHUB_ENV"
      # OP-157 m.6 (i): the Stage 12 specs' inputs, from the bootstrap's own summary: a request
      # pushed for the test user's allowed Exercise with its device's contribution, which the
      # approval spec opens; and one support access episode (the operator asks, the test user's
      # device gives, the operator's Instance views the account), which the account pages show
      - name: Live fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          summary="$RUNNER_TEMP/bootstrap.json"
          $COMPOSE run --rm --no-deps -T --entrypoint cat bootstrap \
            /var/lib/access/bootstrap/bootstrap.json > "$summary"
          jq -e '.support_operator.acceptance == "accepted" and (.breakglass_account.grants | length) >= 2
            and .review_schedule.items >= 1' "$summary"
          hsm=(--hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server)
          pep=(--ca /var/lib/access/certs/ca.crt --cert /var/lib/access/certs/pep.crt
            --key /var/lib/access/certs/pep.key)
          now="$(date +%s)000"
          intent="$(jq -c --argjson now "$now" '.test_user.allowed | {
            action: .action,
            resources: [{ namespace: .resource.namespace, path: [(.resource.path_prefix + "web-live")] }],
            params: { ledger: { eq: "main" }, declaration: { eq: { bytes: "0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dE" } } },
            validity: { from: ($now - 60000), until: ($now + 600000) } }' "$summary")"
          read -r issuer domain party instance grant since cgrant csince < <(jq -r '.test_user as $u | [
            (.realms[] | select(.slug == "acme") | .issuer), $u.allowed.domain, $u.party, $u.instance,
            $u.allowed.basis.holding.grant, $u.allowed.basis.holding.since,
            $u.allowed.contribution.basis.holding.grant, $u.allowed.contribution.basis.holding.since] | @tsv' "$summary")
          $COMPOSE run --rm --no-deps -T local-client push \
            --issuer "$issuer" --api https://access-server:8443 "${pep[@]}" \
            --redirect-uri http://127.0.0.1/cb --identifier test@acme.example "${hsm[@]}" \
            --device-key access/bootstrap/test-user-device --passkey access/bootstrap/test-user-passkey \
            --domain "$domain" --party "$party" --instance "$instance" \
            --grant "$grant" --grant-since "$since" --contribute-grant "$cgrant" --contribute-since "$csince" \
            --reason "The web-live approval page opens this request." \
            --intent-json "$intent" > "$RUNNER_TEMP/pushed.json"
          echo "ACCESS_LIVE_APPROVAL=$(jq -r '"request=\(.request_uri | @uri)&redirect_uri=\(.redirect_uri | @uri)&state=\(.state | @uri)"' "$RUNNER_TEMP/pushed.json")" >> "$GITHUB_ENV"
          read -r operator oparty subject casesystem case < <(jq -r '[.support_operator.identifier,
            .support_operator.party, .test_user.subject, .support_operator.case_system,
            .support_operator.case] | @tsv' "$summary")
          $COMPOSE run --rm --no-deps -T local-client support-episode \
            --issuer "$issuer" --api https://access-server:8443 "${pep[@]}" "${hsm[@]}" \
            --domain "$domain" --operator "$operator" --operator-password-env BOOTSTRAP_TEST_PASSWORD \
            --operator-device-key access/bootstrap/support-operator-device --operator-party "$oparty" \
            --identifier test@acme.example --subject "$subject" --party "$party" \
            --passkey access/bootstrap/test-user-passkey --device-key access/bootstrap/test-user-device \
            --case-system "$casesystem" --case "$case" > "$RUNNER_TEMP/support.json"
          jq -e '(.exercise | length) > 0' "$RUNNER_TEMP/support.json"
          {
            echo "ACCESS_LIVE_SUPPORT_OPERATOR=$operator"
            echo "ACCESS_LIVE_TEST_SUBJECT=$subject"
            echo "ACCESS_LIVE_SUPPORT_CASE_SYSTEM=$casesystem"
            echo "ACCESS_LIVE_SUPPORT_CASE=$case"
            echo "ACCESS_LIVE_REVIEW=$(jq -r '.review_schedule.name' "$summary")"
            echo "ACCESS_LIVE_BREAKGLASS_ORGANIZATION=$(jq -r '.breakglass_account.organisation' "$summary")"
          } >> "$GITHUB_ENV"
      - name: Account pages (@live)
        run: |
          echo "127.0.0.1 access-server" | sudo tee -a /etc/hosts
          cd web/account
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e:live
      - name: Console (@live)
        if: ${{ !cancelled() && steps.totp.outcome == 'success' }}
        run: |
          echo "127.0.0.1 access-server access-server.local" | sudo tee -a /etc/hosts
          cd web/console
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e:live
      - name: Hosted login (@live)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          echo "127.0.0.1 access-server" | sudo tee -a /etc/hosts
          cd web/login
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e:live
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-live-report
          path: |
            web/account/playwright-report
            web/console/playwright-report
            web/login/playwright-report
          retention-days: 7
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes

  # IDP-30 (2), B22, OP-156 m.3 (m), F-5, F-6, F-7, Ek B 5203, 5347: the Access Proxy images, the
  # official Envoy and Caddy images pinned by digest with access-proxy added; each gets a
  # CycloneDX SBOM that names the engine and its version, checked against the built image
  proxy-images:
    name: proxy-images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        engine: [envoy, caddy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: cosign
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=main-${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/proxy/Dockerfile
          target: ${{ matrix.engine }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-proxy-${{ matrix.engine }}:${{ steps.tag.outputs.tag }}
          provenance: false
          sbom: false
      - name: SBOM with the engine version
        env:
          ENGINE: ${{ matrix.engine }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE-proxy-$ENGINE@$DIGEST"
          deploy/proxy/sbom.sh "$ENGINE" "$IMAGE-proxy-$ENGINE@$DIGEST" "$RUNNER_TEMP/sbom.cdx.json"
      - name: Sign the image and attest its SBOM (F-7)
        env:
          ENGINE: ${{ matrix.engine }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE-proxy-$ENGINE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom.cdx.json" "$IMAGE-proxy-$ENGINE@$DIGEST"
      - name: Image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}-proxy-${{ matrix.engine }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          ENGINE: ${{ matrix.engine }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}-proxy-${ENGINE}"
            echo
            echo "\`${IMAGE}-proxy-${ENGINE}@${DIGEST}\`"
            echo
            jq -r '.components[] | "- \(.name) \(.version)"' "$RUNNER_TEMP/sbom.cdx.json"
          } >> "$GITHUB_STEP_SUMMARY"
