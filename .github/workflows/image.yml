# OP-68, F-6, F-7, OP-49, OP-69
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/e-suiss/access

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      local: ghcr.io/e-suiss/access@${{ steps.local.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: cosign
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=main-${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          provenance: false
          sbom: false
      # OP-69, OP-149 m.21: the same binaries with SoftHSM and the local provisioning
      - name: Build and push the local image
        id: local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: local
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-local
            ${{ env.IMAGE }}:local
          provenance: false
          sbom: false
      - name: Sign the images (F-7)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL: ${{ steps.local.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST" "$IMAGE@$LOCAL"
      - name: Image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Local image provenance (F-6)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.local.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL: ${{ steps.local.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "### ${IMAGE}:${TAG}-local"
            echo
            echo "\`${IMAGE}@${LOCAL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # OP-69, OP-149 m.21: the local deployment comes up from the pushed image and serves a product
  local-smoke:
    name: local-smoke
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      ACCESS_IMAGE: ${{ needs.image.outputs.local }}
      COMPOSE: docker compose --file deploy/compose/access.yaml
      # OP-149 m.23: a declared delivery target and its product certificate
      ACCESS_LOCAL_PRODUCT_HOSTS: work-server
      ACCESS_DELIVERY_TARGETS: '[{url="https://work-server:8443/v1/inbound/events", ca_file="/var/lib/access/certs/ca.crt"}]'
      # OP-149 m.26 (b): the bootstrap's test user; this job's own, not a secret
      ACCESS_LOCAL_TEST_PASSWORD: local-smoke-test-user-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # OP-141 m.18 (b): a product's PEP key stays in its token; init signs its CSR
      - name: Product CSR
        run: |
          mkdir -p "$RUNNER_TEMP/products"
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$RUNNER_TEMP/work-pep.key" -subj "/CN=ignored" \
            -out "$RUNNER_TEMP/products/work-pep.csr"
          chmod 0755 "$RUNNER_TEMP/products"
          chmod 0644 "$RUNNER_TEMP/products/work-pep.csr"
          echo "ACCESS_PRODUCT_KEYS=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
      - name: Start
        run: $COMPOSE up --detach --quiet-pull
      - name: Serve
        run: |
          healthy=
          for _ in $(seq 1 60); do
            if $COMPOSE exec -T access-server \
              curl -fsS --cacert /var/lib/access/certs/ca.crt https://localhost:9090/readyz; then
              healthy=1
              break
            fi
            sleep 2
          done
          test -n "$healthy"
          for f in ca.crt pep.crt pep.key; do
            $COMPOSE exec -T access-server cat "/var/lib/access/certs/$f" > "$RUNNER_TEMP/$f"
          done
          $COMPOSE logs --no-color bootstrap
          tls=(-fsS --cacert "$RUNNER_TEMP/ca.crt" --resolve access-server:8443:127.0.0.1)
          curl "${tls[@]}" https://access-server:8443/realms/platform/.well-known/suiss-configuration
          # OP-151 m.3 (b): health is internal only; the management API answers on its own port
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/ca.crt" \
            --resolve access-server:8443:127.0.0.1 https://access-server:8443/healthz)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/ca.crt" \
            --resolve access-server:9443:127.0.0.1 https://access-server:9443/admin/v1/platform)" = 401
          curl "${tls[@]}" --cert "$RUNNER_TEMP/pep.crt" --key "$RUNNER_TEMP/pep.key" \
            https://access-server:8443/access/v1/tenants | grep -q '"tnt_'
          $COMPOSE logs --no-color access-server | grep -q 'declared delivery targets'
          $COMPOSE run --rm --no-deps -T --entrypoint openssl init \
            verify -CAfile /var/lib/access/certs/ca.crt /var/lib/access/product-tls/work-server.crt
          $COMPOSE run --rm --no-deps -T --entrypoint cat init \
            /var/lib/access/product-tls/work-pep.crt > "$RUNNER_TEMP/work-pep.crt"
          openssl verify -CAfile "$RUNNER_TEMP/ca.crt" -purpose sslclient "$RUNNER_TEMP/work-pep.crt"
          curl "${tls[@]}" --cert "$RUNNER_TEMP/work-pep.crt" --key "$RUNNER_TEMP/work-pep.key" \
            https://access-server:8443/access/v1/tenants | grep -q '"tnt_'
          $COMPOSE run --rm --no-deps -T init
          $COMPOSE run --rm --no-deps -T --entrypoint cat init \
            /var/lib/access/product-tls/work-pep.crt | cmp - "$RUNNER_TEMP/work-pep.crt"
      - name: Bootstrap again
        run: |
          $COMPOSE run --rm --no-deps -T bootstrap > "$RUNNER_TEMP/again.json"
          grep -q '"created": false' "$RUNNER_TEMP/again.json"
          ! grep -q '"created": true' "$RUNNER_TEMP/again.json"
      # OP-149 m.26 (b), (c), (e), m.32: the headless sign-in with the password and the software
      # passkey, bound to the test user's known device Instance, the sign-in with the passkey
      # alone, and a compromise declaration over the PEP certificate, each against the running
      # deployment
      - name: Local client
        run: |
          client_id="$(jq -r '.test_user.client_id' "$RUNNER_TEMP/again.json")"
          issuer="$(jq -r '.realms[] | select(.slug == "acme") | .issuer' "$RUNNER_TEMP/again.json")"
          instance="$(jq -r '.test_user.instance' "$RUNNER_TEMP/again.json")"
          $COMPOSE run --rm --no-deps -T local-client login \
            --issuer "$issuer" --ca /var/lib/access/certs/ca.crt \
            --client-id "$client_id" --redirect-uri http://127.0.0.1/cb \
            --identifier test@acme.example --password-env BOOTSTRAP_TEST_PASSWORD \
            --passkey access/bootstrap/test-user-passkey \
            --device-key access/bootstrap/test-user-device \
            --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server \
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server > "$RUNNER_TEMP/tokens.json"
          jq -e '.token_type == "DPoP" and (.access_token | length > 0) and (.id_token | length > 0)' "$RUNNER_TEMP/tokens.json"
          jq -e --arg instance "$instance" '.instance == $instance' "$RUNNER_TEMP/tokens.json"
          $COMPOSE run --rm --no-deps -T local-client login \
            --issuer "$issuer" --ca /var/lib/access/certs/ca.crt \
            --client-id "$client_id" --redirect-uri http://127.0.0.1/cb \
            --identifier test@acme.example --passkey access/bootstrap/test-user-passkey \
            --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server \
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server > "$RUNNER_TEMP/passkey-tokens.json"
          jq -e '.token_type == "DPoP" and (.access_token | length > 0)' "$RUNNER_TEMP/passkey-tokens.json"
          domain="$(jq -r '.compromise.domain' "$RUNNER_TEMP/again.json")"
          declarant="$(jq -r '.compromise.issuer' "$RUNNER_TEMP/again.json")"
          party="$(jq -r '.sample.subject' "$RUNNER_TEMP/again.json")"
          $COMPOSE run --rm --no-deps -T local-client compromise \
            --api https://access-server:8443 --ca /var/lib/access/certs/ca.crt \
            --cert /var/lib/access/certs/pep.crt --key /var/lib/access/certs/pep.key \
            --domain "$domain" --issuer-party "$declarant" --party "$party" > "$RUNNER_TEMP/claim.json"
          jq -e '.disposition == "admit"' "$RUNNER_TEMP/claim.json"
      # OP-149 m.29 (b): an allowed Exercise end to end on the hosted Approval Surface, as the
      # product's PEP; the receipt verifies against the domain's published metadata
      - name: Local approval
        run: |
          now="$(date +%s)000"
          intent="$(jq -c --argjson now "$now" '.test_user.allowed | {
            action: .action,
            resources: [{ namespace: .resource.namespace, path: [(.resource.path_prefix + "local-smoke")] }],
            params: { ledger: { eq: "main" }, declaration: { eq: { bytes: "0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dE" } } },
            validity: { from: ($now - 60000), until: ($now + 600000) } }' "$RUNNER_TEMP/again.json")"
          read -r issuer domain party instance grant since cgrant csince < <(jq -r '.test_user as $u | [
            (.realms[] | select(.slug == "acme") | .issuer), $u.allowed.domain, $u.party, $u.instance,
            $u.allowed.basis.holding.grant, $u.allowed.basis.holding.since,
            $u.allowed.contribution.basis.holding.grant, $u.allowed.contribution.basis.holding.since] | @tsv' "$RUNNER_TEMP/again.json")
          $COMPOSE run --rm --no-deps -T local-client approve \
            --issuer "$issuer" --api https://access-server:8443 --ca /var/lib/access/certs/ca.crt \
            --cert /var/lib/access/certs/pep.crt --key /var/lib/access/certs/pep.key \
            --redirect-uri http://127.0.0.1/cb --identifier test@acme.example \
            --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-token access-server \
            --hsm-pin-file /var/lib/access/secrets/hsm-access-server \
            --device-key access/bootstrap/test-user-device --passkey access/bootstrap/test-user-passkey \
            --domain "$domain" --party "$party" --instance "$instance" \
            --grant "$grant" --grant-since "$since" --contribute-grant "$cgrant" --contribute-since "$csince" \
            --intent-json "$intent" > "$RUNNER_TEMP/approved.json"
          jq -e '.receipt.verified == true and .render_digest_verified == true and (.exercise | length > 0)' "$RUNNER_TEMP/approved.json"
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes
