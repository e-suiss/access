[package]
name = "access-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
access-kernel = { package = "esuiss-access-kernel", path = "../crates/kernel" }
suiss-crypto = { package = "esuiss-crypto", path = "../crates/suiss-crypto", default-features = false, features = ["verify"] }
suiss-restriction = { package = "esuiss-restriction", path = "../crates/suiss-restriction" }
access-crypto = { path = "../crates/crypto", features = ["testing"] }
access-edge-core = { path = "../crates/edge-core", default-features = false }
access-internal-api = { path = "../crates/internal-api" }
access-parse = { path = "../crates/parse" }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
quick-xml = { version = "=0.42.0", default-features = false }
# OP-159 m.3 (cc)
bytes = { version = "1.12.1", default-features = false }
ldap3_proto = { version = "=0.8.1", default-features = false, features = ["strict"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }

[profile.release]
debug = 1

[[bin]]
name = "dcbor_decode"
path = "fuzz_targets/dcbor_decode.rs"
test = false
doc = false

[[bin]]
name = "model_decode"
path = "fuzz_targets/model_decode.rs"
test = false
doc = false

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false

[[bin]]
name = "cose_verify"
path = "fuzz_targets/cose_verify.rs"
test = false
doc = false

[[bin]]
name = "jws_verify"
path = "fuzz_targets/jws_verify.rs"
test = false
doc = false

[[bin]]
name = "sd_jwt_verify"
path = "fuzz_targets/sd_jwt_verify.rs"
test = false
doc = false

[[bin]]
name = "merkle_proofs"
path = "fuzz_targets/merkle_proofs.rs"
test = false
doc = false

[[bin]]
name = "restriction_compile"
path = "fuzz_targets/restriction_compile.rs"
