# F-1, OP-5, CR-14

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # F-2, F-15: 0.7.6 carries the RUSTSEC-2026-0387 fix; it was yanked on 2026-10-25 for an API
    # break, not a vulnerability, and the replacements (0.7.9, 0.7.10) are inside the 7-day
    # cooldown until 2026-11-01. Drop this entry with that update.
    { crate = "crypto-bigint@0.7.6", reason = "yanked for an API break; replacement in cooldown until 2026-11-01" },
]

# F-1
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# F-1, OP-130: Mozilla's CA bundle, pulled in by sqlx's aws-lc-rs TLS; data under a permissive
# licence. Store connections never use it: they verify against an explicit root (verify-full)
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# F-1, OP-116: uniffi is MPL-2.0 (file-level copyleft, not GPL)
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # F-1, MD-1
    { crate = "openssl", reason = "F-1: aws-lc-rs only" },
    { crate = "openssl-sys", reason = "F-1: aws-lc-rs only" },
    # CR-14
    { crate = "rsa", reason = "CR-14: Marvin timing side channel, no fix" },
    { crate = "ring", reason = "CR-14: aws-lc-rs only" },
    # CR-14
    { crate = "libcrux", reason = "CR-14" },
    { crate = "libcrux-ml-kem", reason = "CR-14" },
    { crate = "libcrux-ml-dsa", reason = "CR-14" },
    { crate = "libcrux-aesgcm", reason = "CR-14" },
    { crate = "libcrux-sha3", reason = "CR-14" },
    { crate = "libcrux-ecdh", reason = "CR-14" },
    { crate = "libcrux-ed25519", reason = "CR-14" },
    { crate = "libcrux-hkdf", reason = "CR-14" },
    { crate = "libcrux-hmac", reason = "CR-14" },
    { crate = "libcrux-kem", reason = "CR-14" },
    { crate = "libcrux-signature", reason = "CR-14" },
    # CR-14
    { crate = "ml-kem", reason = "CR-14: unaudited" },
    { crate = "ml-dsa", reason = "CR-14: RUSTSEC-2025-0144" },
    { crate = "slh-dsa", reason = "CR-14: unaudited" },
    { crate = "pqcrypto", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-mlkem", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-mldsa", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-kyber", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-dilithium", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-sphincsplus", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-traits", reason = "CR-14: PQ comes from aws-lc-rs" },
    # OP-5
    { crate = "openidconnect", reason = "OP-5: client library, depends on rsa" },
    { crate = "josekit", reason = "OP-5: depends on C OpenSSL" },
    { crate = "ntex", reason = "OP-5: ecosystem and maintenance" },
    { crate = "poem", reason = "OP-5: ecosystem and maintenance" },
    { crate = "h3", reason = "OP-5: ecosystem and maintenance" },
    { crate = "gamlastan", reason = "OP-5: not a SAML domain model (XSW defence)" },
    { crate = "serde_stacker", reason = "OP-5, §14.6: unbounded JSON depth" },
    { crate = "unshare", reason = "OP-5: unmaintained" },
    { crate = "cap", reason = "OP-5: aborts when the limit is exceeded" },
    # OP-5, P-256
    { crate = "p256", wrappers = ["esuiss-access-kernel"], reason = "OP-5: aws-lc-rs is 7.6x/4.9x faster; CR-55 m.1: verify-only in the no_std Kernel" },
    { crate = "diesel@<2.3.8", reason = "OP-5: RUSTSEC-2026-0136" },
    # OP-4, SA-22
    { crate = "io-uring", reason = "SA-22" },
    { crate = "tokio-uring", reason = "SA-22" },
    { crate = "rio", reason = "SA-22" },
    { crate = "glommio", reason = "SA-22" },
    { crate = "monoio", reason = "SA-22" },
    # CR-13, CR-54: aws-lc-rs on the server, ed25519-dalek and p256 in the Kernel
    { crate = "ring-compat", reason = "CR-13: aws-lc-rs only" },
    { crate = "boring", reason = "CR-13: aws-lc-rs only" },
    { crate = "boring-sys", reason = "CR-13: aws-lc-rs only" },
    { crate = "native-tls", reason = "CR-13, CR-12: rustls with aws-lc-rs only" },
    { crate = "mbedtls", reason = "CR-13: aws-lc-rs only" },
    { crate = "wolfssl", reason = "CR-13: aws-lc-rs only" },
    { crate = "botan", reason = "CR-13: aws-lc-rs only" },
    { crate = "sodiumoxide", reason = "CR-13: aws-lc-rs only" },
    { crate = "libsodium-sys", reason = "CR-13: aws-lc-rs only" },
    { crate = "orion", reason = "CR-13: aws-lc-rs only" },
    { crate = "ed25519-compact", reason = "CR-54: one Ed25519 acceptance set (CR-53)" },
    { crate = "ed25519-zebra", reason = "CR-54, CR-11: ZIP-215 acceptance and batch verification" },
    # CR-3: HMAC only for keyed derivation; RFC 6979 nonces are one
    { crate = "hmac", wrappers = ["rfc6979", "hkdf", "sqlx-postgres"], reason = "CR-3, CR-13: HMAC comes from aws-lc-rs; OP-130 m.10: the driver's SCRAM-SHA-256 client" },
    # §9.7A.7: no external authorization engine
    { crate = "openfga-rs", reason = "§9.7A.7" },
    { crate = "openfga-client", reason = "§9.7A.7" },
    { crate = "spicedb-client", reason = "§9.7A.7" },
    { crate = "spicedb-rust", reason = "§9.7A.7" },
    { crate = "authzed", reason = "§9.7A.7" },
    { crate = "ory-keto-client", reason = "§9.7A.7" },
    { crate = "casbin", reason = "§9.7A.7" },
    { crate = "oso", reason = "§9.7A.7" },
    { crate = "polar-core", reason = "§9.7A.7" },
    { crate = "regorus", reason = "§9.7A.7" },
    { crate = "burrego", reason = "§9.7A.7" },
    # SA-32
    { crate = "fancy-regex", reason = "SA-32: backtracking" },
    { crate = "pcre2", reason = "SA-32: backtracking" },
    { crate = "pcre2-sys", reason = "SA-32: backtracking" },
    { crate = "onig", reason = "SA-32: backtracking" },
    { crate = "onig_sys", reason = "SA-32: backtracking" },
]

[[bans.features]]
crate = "jsonwebtoken"
deny = ["rust_crypto"]

# CR-11
[[bans.features]]
crate = "ed25519-dalek"
deny = ["batch"]

[[bans.features]]
crate = "serde_json"
deny = ["unbounded_depth"]

[[bans.features]]
crate = "rustls"
deny = ["ring"]

# F-1
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
