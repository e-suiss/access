[package]
name = "access-identity-proxy"
description = "Forward-auth of the identity plane (IDP-30, OP-156 m.3 (l)): the Nginx, Traefik, Caddy and Envoy ext_authz HTTP protocols, proxy registrations as PEPs, the __Host-access-proxy session set by OIDC code and PKCE, the decision cache bound to the ValidityContract horizon and the signed application token."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
