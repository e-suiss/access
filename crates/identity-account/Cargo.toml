[package]
name = "access-identity-account"
description = "Identity subjects, identifiers, credentials and the account life cycle (CMP-15.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# OP-153 m.3 (aa): in-memory vault keys for tests of other crates
testing = ["access-crypto/testing"]

[dependencies]
access-crypto = { workspace = true }
access-identity-hooks = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
access-store = { workspace = true }
access-telemetry = { workspace = true }
suiss-retention = { workspace = true }
suiss-crypto = { workspace = true, features = ["aead"] }
argon2 = { workspace = true, features = ["alloc", "password-hash"] }
unicode-normalization = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "net", "io-util"] }
tracing = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "formatting", "macros"] }
zeroize = { workspace = true, features = ["alloc"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
httparse = { workspace = true, features = ["std"] }

[dev-dependencies]
access-crypto = { workspace = true, features = ["testing"] }
access-identity-account = { path = ".", features = ["testing"] }
access-store = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
