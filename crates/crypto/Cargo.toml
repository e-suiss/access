[package]
name = "access-crypto"
description = "Cryptography for Access servers: secrets, envelope encryption, event and opaque identifiers on aws-lc-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# OP-135 m.4: the in-process KEK, for tests of other crates
testing = []

[dependencies]
access-kernel = { workspace = true }
thiserror = { workspace = true }
aws-lc-rs = { workspace = true }
secrecy = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["alloc", "std"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
static_assertions = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

# R-2, CR-39 m.5, m.6: the workspace lints with unsafe_code = "deny" (DIT guard, ctgrind)
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
