[package]
name = "access-identity-session"
description = "Typed authentication state machine, login sessions and epochs (CMP-15.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-crypto = { workspace = true }
access-identity-account = { workspace = true }
access-identity-webauthn = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
access-parse = { workspace = true }
access-store = { workspace = true }
suiss-crypto = { workspace = true, features = ["aead"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[dev-dependencies]
access-crypto = { workspace = true, features = ["testing"] }
access-store = { workspace = true, features = ["testing"] }
aws-lc-rs = { workspace = true }
suiss-crypto = { workspace = true, features = ["aead", "signer"] }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
