[package]
name = "access-authority-sequencer"
description = "CMP-3 sequencer: Kernel records on the ledger engine and the domain log (OP-130)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-authority-signer = { path = "../authority-signer" }
access-kernel = { workspace = true }
access-crypto = { workspace = true }
access-store = { workspace = true }
access-telemetry = { workspace = true }
suiss-ledger = { workspace = true, features = ["doorbell"] }
suiss-crypto = { workspace = true, features = ["pkcs11"] }
thiserror = { workspace = true }
# OP-158 m.3 (d), (k): witness exchanges and Roughtime samples
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
aws-lc-rs = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
access-crypto = { workspace = true, features = ["testing"] }
access-store = { workspace = true, features = ["testing"] }
# OP-158 m.3 (k): the local Roughtime twin
suiss-crypto = { workspace = true, features = ["pkcs11", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
