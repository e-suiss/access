[package]
name = "access-identity-signer"
description = "CMP-22b identity signer: realm JOSE key sets, their rotation and JWKS publication, and JWS token signatures (CR-18 to CR-27)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-kernel = { workspace = true }
access-crypto = { workspace = true }
access-internal-api = { workspace = true }
suiss-crypto = { workspace = true, features = ["signer", "aead"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt"] }

[dev-dependencies]
suiss-crypto = { workspace = true, features = ["signer", "aead", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
