[package]
name = "access-sandbox"
description = "Runtime lockdown for Access processes: prctl, capabilities, Landlock, two-phase seccomp, memfd_secret (SA-22)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror = { workspace = true }
zeroize = { workspace = true }

# SA-22
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }
rustix = { workspace = true, features = ["std", "process", "thread", "mm", "fs"] }
libc = { workspace = true }

[[test]]
name = "lockdown"
harness = false

# R-2, OP-3
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
