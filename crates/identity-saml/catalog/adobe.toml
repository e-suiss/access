# SSO app catalog template (IDP-28, OP-155 m.3 (i)): data only. Creating a connection from it is
# idp.saml.sp_register; a template that maps a Claim which selects authority is idp.saml.sp_mapping
# (reserved, CT3, L6). `{name}` placeholders are the administrator's values.
v = 1
template = "adobe"
name = "Adobe Admin Console"
category = "design"
selects_authority = false
parameters = ["alias"]

[saml]
entity_id = "https://federatedid-na1.services.adobe.com/federated/saml/metadata/alias/{alias}"
acs = "https://federatedid-na1.services.adobe.com/federated/saml/SSO/alias/{alias}"
nameid_format = "email"
attributes = ["Email", "FirstName", "LastName"]
