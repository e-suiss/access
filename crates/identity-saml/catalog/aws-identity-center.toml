# SSO app catalog template (IDP-28, OP-155 m.3 (i)): data only. Creating a connection from it is
# idp.saml.sp_register; a template that maps a Claim which selects authority is idp.saml.sp_mapping
# (reserved, CT3, L6). `{name}` placeholders are the administrator's values.
v = 1
template = "aws-identity-center"
name = "AWS IAM Identity Center"
category = "cloud"
profile = "aws-identity-center"
selects_authority = false
parameters = ["region", "instance"]

[saml]
entity_id = "https://{region}.signin.aws.amazon.com/platform/saml/{instance}"
acs = "https://{region}.signin.aws.amazon.com/platform/saml/acs/{instance}"
nameid_format = "email"
attributes = ["email"]
