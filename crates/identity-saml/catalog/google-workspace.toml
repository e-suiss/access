# SSO app catalog template (IDP-28, OP-155 m.3 (i)): data only. Creating a connection from it is
# idp.saml.sp_register; a template that maps a Claim which selects authority is idp.saml.sp_mapping
# (reserved, CT3, L6). `{name}` placeholders are the administrator's values.
v = 1
template = "google-workspace"
name = "Google Workspace"
category = "productivity"
profile = "google-workspace"
selects_authority = false
parameters = ["domain"]

[saml]
entity_id = "google.com/a/{domain}"
acs = "https://www.google.com/a/{domain}/acs"
nameid_format = "email"
attributes = ["email"]
