# SSO app catalog template (IDP-28, OP-155 m.3 (i)): data only. Creating a connection from it is
# idp.saml.sp_register; a template that maps a Claim which selects authority is idp.saml.sp_mapping
# (reserved, CT3, L6). `{name}` placeholders are the administrator's values.
v = 1
template = "cloudflare"
name = "Cloudflare Zero Trust"
category = "security"
selects_authority = false
parameters = ["team"]

[saml]
entity_id = "https://{team}.cloudflareaccess.com/cdn-cgi/access/callback"
acs = "https://{team}.cloudflareaccess.com/cdn-cgi/access/callback"
nameid_format = "email"
attributes = ["email"]

[oidc]
redirect_uris = ["https://{team}.cloudflareaccess.com/cdn-cgi/access/callback"]
