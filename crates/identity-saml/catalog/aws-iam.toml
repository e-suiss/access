# SSO app catalog template (IDP-28, OP-155 m.3 (i)): data only. Creating a connection from it is
# idp.saml.sp_register; a template that maps a Claim which selects authority is idp.saml.sp_mapping
# (reserved, CT3, L6). `{name}` placeholders are the administrator's values.
v = 1
template = "aws-iam"
name = "AWS IAM SAML"
category = "cloud"
profile = "aws-iam"
selects_authority = true
parameters = []

[saml]
entity_id = "urn:amazon:webservices"
acs = "https://signin.aws.amazon.com/saml"
nameid_format = "persistent"
attributes = ["https://aws.amazon.com/SAML/Attributes/Role", "https://aws.amazon.com/SAML/Attributes/RoleSessionName"]
