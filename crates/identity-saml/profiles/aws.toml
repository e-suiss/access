# Interop profile (IDP-28, IDP-40, conformance/cddl/interop-profile.cddl): format differences only.
v = 1
profile = "saml.aws"
protocol = "saml"
counterpart = "Amazon Web Services (console federation)"
revision = 1
template = "aws"

[[tolerances]]
rule = "saml.attribute_names"
value = ["https://aws.amazon.com/SAML/Attributes/Role", "https://aws.amazon.com/SAML/Attributes/RoleSessionName"]
test = "identity_saml::profile::tests::aws_requires_role_and_session_name"
source = "docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_saml_assertions.html"

[[tolerances]]
rule = "saml.attribute_multi_value"
value = true
test = "identity_saml::profile::tests::aws_requires_role_and_session_name"

[[tolerances]]
rule = "saml.idp_initiated"
value = true
test = "identity_saml::profile::tests::idp_initiated_stays_opt_in_per_registration"
