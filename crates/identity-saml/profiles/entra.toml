# Interop profile (IDP-28, IDP-40, conformance/cddl/interop-profile.cddl): format differences only.
v = 1
profile = "saml.entra"
protocol = "saml"
counterpart = "Microsoft Entra ID / Microsoft 365"
revision = 1
template = "entra"

[[tolerances]]
rule = "saml.nameid_format"
value = "persistent"
test = "identity_saml::domain::profile::tests::entra_takes_persistent_and_idp_email"

[[tolerances]]
rule = "saml.attribute_names"
value = ["IDPEmail"]
test = "identity_saml::domain::profile::tests::entra_takes_persistent_and_idp_email"

[[tolerances]]
rule = "saml.attribute_name_format"
value = "unspecified"
test = "identity_saml::domain::profile::tests::entra_takes_persistent_and_idp_email"
