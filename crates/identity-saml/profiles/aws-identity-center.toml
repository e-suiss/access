# Interop profile (IDP-28, IDP-40, conformance/cddl/interop-profile.cddl): format differences only.
v = 1
profile = "saml.aws_identity_center"
protocol = "saml"
counterpart = "AWS IAM Identity Center"
revision = 1
template = "aws-identity-center"

[[tolerances]]
rule = "saml.nameid_format"
value = "email"
test = "identity_saml::profile::tests::identity_center_takes_email_and_no_encryption"
source = "docs.aws.amazon.com/singlesignon/latest/userguide/other-idps.html"

[[tolerances]]
rule = "saml.encrypt_assertion"
value = "unsupported"
test = "identity_saml::profile::tests::identity_center_takes_email_and_no_encryption"
