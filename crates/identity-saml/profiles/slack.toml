# Interop profile (IDP-28, IDP-40, conformance/cddl/interop-profile.cddl): format differences only.
v = 1
profile = "saml.slack"
protocol = "saml"
counterpart = "Slack"
revision = 1
template = "slack"

[[tolerances]]
rule = "saml.sign_response"
value = true
test = "identity_saml::domain::profile::tests::slack_requires_the_response_signature_and_no_logout"
source = "slack.com/help/articles/205168057"

[[tolerances]]
rule = "saml.nameid_format"
value = "persistent"
test = "identity_saml::domain::profile::tests::slack_requires_the_response_signature_and_no_logout"

[[tolerances]]
rule = "saml.attribute_names"
value = ["User.Email"]
test = "identity_saml::domain::profile::tests::slack_requires_the_response_signature_and_no_logout"

[[tolerances]]
rule = "saml.acs_binding"
value = "post"
test = "identity_saml::domain::profile::tests::slack_requires_the_response_signature_and_no_logout"

[[tolerances]]
rule = "saml.slo_binding"
value = "none"
test = "identity_saml::domain::profile::tests::slack_requires_the_response_signature_and_no_logout"
