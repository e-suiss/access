[package]
name = "access-authority-signer"
description = "CMP-22a authority signer: operational key rotation, Domain Metadata and artefact signatures (CR-18 to CR-27)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-crypto = { workspace = true }
access-kernel = { workspace = true }
suiss-crypto = { workspace = true, features = ["pkcs11", "aead"] }
thiserror = { workspace = true }
access-telemetry = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "io-util", "rt"] }

[dev-dependencies]
suiss-crypto = { workspace = true, features = ["pkcs11", "aead", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
