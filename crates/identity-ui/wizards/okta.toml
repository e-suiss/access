# SSO setup wizard (TN-134, OP-155 m.3 (i)): data steps only.
v = 1
provider = "okta"
name = "Okta"
protocols = ["saml", "oidc"]
scim = true

[[steps]]
action = "open"
place = "Admin Console > Applications > Applications > Create App Integration"

[[steps]]
protocol = "saml"
action = "copy"
value = "acs_url"
field = "Single sign-on URL"

[[steps]]
protocol = "saml"
action = "copy"
value = "entity_id"
field = "Audience URI (SP Entity ID)"

[[steps]]
protocol = "saml"
action = "paste"
input = "metadata_url"
field = "Metadata URL"

[[steps]]
protocol = "saml"
action = "paste"
input = "entity_id"
field = "Issuer"

[[steps]]
protocol = "oidc"
action = "copy"
value = "redirect_uri"
field = "Sign-in redirect URIs"

[[steps]]
protocol = "oidc"
action = "paste"
input = "client_id"
field = "Client ID"

[[steps]]
protocol = "oidc"
action = "paste"
input = "issuer"
field = "Okta domain (issuer)"

[[steps]]
action = "open"
place = "Provisioning > Configure API Integration"

[[steps]]
action = "copy"
value = "scim_base_url"
field = "SCIM connector base URL"
