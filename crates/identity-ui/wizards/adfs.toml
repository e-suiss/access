# SSO setup wizard (TN-134, OP-155 m.3 (i)): data steps only.
v = 1
provider = "adfs"
name = "Active Directory Federation Services"
protocols = ["saml"]
scim = false

[[steps]]
action = "open"
place = "AD FS Management > Relying Party Trusts > Add Relying Party Trust"

[[steps]]
action = "copy"
value = "metadata_url"
field = "Federation metadata address"

[[steps]]
action = "paste"
input = "metadata_url"
field = "Federation metadata URL (FederationMetadata/2007-06/FederationMetadata.xml)"

[[steps]]
action = "paste"
input = "entity_id"
field = "Federation Service Identifier"
