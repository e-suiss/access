[package]
name = "esuiss-access-kernel"
description = "Access Kernel (CMP-24): the single no_std implementation of Access semantics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "access_kernel"

[dependencies]
suiss-crypto = { workspace = true, features = ["verify"] }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
p256 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true

# OP-72
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
divan = { workspace = true }
gungraun = { workspace = true, features = ["default"] }

# OP-84
[[bench]]
name = "kernel_wallclock"
harness = false

[[bench]]
name = "kernel_instructions"
harness = false
