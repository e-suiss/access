[package]
name = "access-authority-core"
description = "CMP-4 authority core: the Exercise commit path from request to committed records (§17.1.1, OP-141)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-authority-ingest = { workspace = true }
access-authority-signer = { path = "../authority-signer" }
access-crypto = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
access-store = { workspace = true }
access-telemetry = { workspace = true }
miniz_oxide = { workspace = true }
access-authority-sequencer = { path = "../authority-sequencer" }
suiss-crypto = { workspace = true, features = ["pkcs11"] }
suiss-ledger = { workspace = true }
suiss-restriction = { workspace = true }
tracing = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
access-crypto = { workspace = true, features = ["testing"] }
# OP-150 L8: the Reference Verifier's SDK accepts what the core issues, byte for byte
access-verifier = { workspace = true, features = ["testing"] }
suiss-crypto = { workspace = true, features = ["pkcs11", "aead", "testing"] }
access-store = { workspace = true, features = ["testing"] }
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
