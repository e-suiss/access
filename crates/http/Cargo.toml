[package]
name = "access-http"
description = "HTTP layer shared by both Access planes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-authority-core = { path = "../authority-core" }
access-authority-sequencer = { path = "../authority-sequencer" }
access-identity-admin = { workspace = true }
access-identity-events = { workspace = true }
access-identity-federation = { workspace = true }
access-identity-oauth = { workspace = true }
access-identity-attest = { workspace = true }
access-identity-account = { workspace = true }
access-identity-edge = { workspace = true }
access-identity-session = { workspace = true }
access-identity-ui = { workspace = true }
access-identity-vault = { workspace = true }
access-identity-x509 = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
suiss-crypto = { workspace = true, features = ["aead", "verify"] }
access-parse = { workspace = true }
access-telemetry = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio", "json"] }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "service", "tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "macros", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "formatting", "parsing", "macros"] }
tower = { workspace = true, features = ["limit", "util"] }
tower-http = { workspace = true, features = ["catch-panic", "limit", "timeout", "request-id", "trace"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
access-crypto = { workspace = true, features = ["testing"] }
access-identity-account = { workspace = true, features = ["testing"] }
access-identity-hooks = { workspace = true }
access-identity-signer = { path = "../identity-signer" }
access-identity-webauthn = { workspace = true }
access-store = { workspace = true, features = ["testing"] }
aws-lc-rs = { workspace = true }
proptest = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true, features = ["signer", "aead", "testing"] }
serde_json = { workspace = true, features = ["std"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }

[lints]
workspace = true
