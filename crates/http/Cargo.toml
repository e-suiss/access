[package]
name = "access-http"
description = "HTTP layer shared by both Access planes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio", "json"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "formatting", "macros"] }
tower = { workspace = true, features = ["limit", "util"] }
tower-http = { workspace = true, features = ["catch-panic", "limit", "timeout", "request-id", "trace"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
