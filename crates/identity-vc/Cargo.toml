[package]
name = "access-identity-vc"
description = "The identity plane's person-attribute credential issuer (OID4VCI, SD-JWT VC), sans I/O: verified name, age, contact verification and household membership, bound to the holder's device key or an agent `KeyBinding`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# OP-155 m.3 (p), E55
access-kernel = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
suiss-crypto = { workspace = true, features = ["signer"] }

[lints]
workspace = true
