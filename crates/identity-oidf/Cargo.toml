[package]
name = "access-identity-oidf"
description = "OpenID Federation 1.0 for the identity plane, sans I/O: entity statements, trust chains, metadata policy, trust marks and registration checks (IDP-19, IDP-20)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# run-time federations for other crates' tests
testing = ["dep:suiss-crypto"]

[dependencies]
suiss-crypto = { workspace = true, optional = true, features = ["signer"] }
access-crypto = { workspace = true }
access-kernel = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
aws-lc-rs = { workspace = true }

[lints]
workspace = true
