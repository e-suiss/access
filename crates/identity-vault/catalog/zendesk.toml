# AG-39: Zendesk, per subdomain; refresh tokens are single use.
# Source: developer.zendesk.com/documentation/authentication/refresh-token
id = "zendesk"
display_name = "Zendesk"
authorization_endpoint = "https://{subdomain}.zendesk.com/oauth/authorizations/new"
token_endpoint = "https://{subdomain}.zendesk.com/oauth/tokens"
refresh = "rotating"
placeholders = ["subdomain"]

[[scopes]]
name = "read"
description = "Read everything the person can"

[[scopes]]
name = "tickets:read"
description = "Read tickets"

[[scopes]]
name = "tickets:write"
description = "Create and edit tickets"
