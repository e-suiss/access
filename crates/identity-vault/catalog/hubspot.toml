# AG-39: HubSpot; refresh tokens are revoked through their own API, not RFC 7009.
# Source: developers.hubspot.com/docs/api-reference/legacy/authentication/manage-oauth-tokens
id = "hubspot"
display_name = "HubSpot"
authorization_endpoint = "https://app.hubspot.com/oauth/authorize"
token_endpoint = "https://api.hubapi.com/oauth/v3/token"
lifetime_s = 1800
refresh = "reusable"
pkce = false

[[scopes]]
name = "oauth"
description = "Basic OAuth access"

[[scopes]]
name = "crm.objects.contacts.read"
description = "Read contacts"

[[scopes]]
name = "crm.objects.contacts.write"
description = "Create and edit contacts"
