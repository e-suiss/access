# AG-39: Airtable; PKCE is mandatory. Source: airtable.com/developers/web/api/oauth-reference
id = "airtable"
display_name = "Airtable"
authorization_endpoint = "https://airtable.com/oauth2/v1/authorize"
token_endpoint = "https://airtable.com/oauth2/v1/token"
lifetime_s = 3600
refresh = "rotating"

[[scopes]]
name = "data.records:read"
description = "Read records"

[[scopes]]
name = "data.records:write"
description = "Create and edit records"

[[scopes]]
name = "schema.bases:read"
description = "Read base structure"
