# AG-39: Zoom user-level OAuth apps with granular scopes.
# Source: developers.zoom.us/docs/integrations/oauth
id = "zoom"
display_name = "Zoom"
authorization_endpoint = "https://zoom.us/oauth/authorize"
token_endpoint = "https://zoom.us/oauth/token"
revocation_endpoint = "https://zoom.us/oauth/revoke"
lifetime_s = 3600
refresh = "rotating"

[[scopes]]
name = "user:read:user"
description = "Read the person's profile"

[[scopes]]
name = "meeting:read:list_meetings"
description = "List meetings"

[[scopes]]
name = "meeting:read:meeting"
description = "Read a meeting"

[[scopes]]
name = "meeting:write:meeting"
description = "Create meetings"

[[scopes]]
name = "meeting:update:meeting"
description = "Edit meetings"
