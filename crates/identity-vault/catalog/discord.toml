# AG-39: Discord. Source: discord.com/developers/docs/topics/oauth2
id = "discord"
display_name = "Discord"
authorization_endpoint = "https://discord.com/oauth2/authorize"
token_endpoint = "https://discord.com/api/oauth2/token"
revocation_endpoint = "https://discord.com/api/oauth2/token/revoke"
lifetime_s = 604800
refresh = "rotating"

[[scopes]]
name = "identify"
description = "Read the person's profile"

[[scopes]]
name = "guilds"
description = "List the person's servers"

[[scopes]]
name = "messages.read"
description = "Read messages"
