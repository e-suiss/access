[package]
name = "access-identity-directory"
description = "Active Directory sync (§10.6.4, IDP-17, OP-155 m.3 (n)): an incremental LDAP pull connector over LDAPS, without password replication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-crypto = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
