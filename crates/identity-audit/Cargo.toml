[package]
name = "access-identity-audit"
description = "Identity plane audit: checkpointed chains off the request path, the audit taxonomy and its OCSF, CEF and SET renderings (OP-37, OP-41, OP-44, OP-134)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-crypto = { workspace = true }
access-identity-signer = { path = "../identity-signer" }
access-kernel = { workspace = true }
access-store = { workspace = true }
suiss-crypto = { workspace = true, features = ["signer"] }
suiss-ledger = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
toml = { workspace = true, features = ["std", "parse", "serde"] }

[dev-dependencies]
access-store = { workspace = true, features = ["testing"] }
suiss-crypto = { workspace = true, features = ["signer", "aead", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
