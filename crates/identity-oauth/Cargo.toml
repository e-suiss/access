[package]
name = "access-identity-oauth"
description = "OAuth 2.1 authorization server and OpenID Provider of a realm (CMP-15.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-crypto = { workspace = true }
access-identity-account = { workspace = true }
access-identity-session = { workspace = true }
access-identity-signer = { path = "../identity-signer" }
access-kernel = { workspace = true }
access-store = { workspace = true }
suiss-crypto = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "net", "io-util"] }
tracing = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
httparse = { workspace = true, features = ["std"] }

[dev-dependencies]
access-crypto = { workspace = true, features = ["testing"] }
access-store = { workspace = true, features = ["testing"] }
aws-lc-rs = { workspace = true }
ed25519-dalek = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
suiss-crypto = { workspace = true, features = ["signer", "aead", "testing"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
