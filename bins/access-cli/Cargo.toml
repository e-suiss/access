[package]
name = "access-cli"
description = "Access operator and developer command line (OP-151 m.3 (h)): the schema migration job, the admin, GitOps and replay commands, and `ssh login` (IDP-32)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "access-cli"
path = "src/main.rs"

[dependencies]
# OP-158 m.3 (m): `domain recover` plans with the open recovery rules and reads export packages
access-authority-core = { path = "../../crates/authority-core" }
access-authority-sequencer = { path = "../../crates/authority-sequencer" }
access-crypto = { workspace = true }
# OP-159 m.3 (ii): `realm check` reports with the profile check of the admin domain
access-identity-admin = { workspace = true }
access-identity-oauth = { workspace = true }
access-identity-risk = { workspace = true }
access-identity-ssh = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
access-sdk = { workspace = true, features = ["std"] }
access-store = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
figment = { workspace = true, features = ["env", "toml"] }
httparse = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true, features = ["pkcs11"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "io-util", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
access-telemetry = { workspace = true }

[dev-dependencies]
access-store = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
