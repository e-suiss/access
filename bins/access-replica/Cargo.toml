[package]
name = "access-replica"
description = "Open Access replica agent (§16.6.1, OP-158 m.3 (f), (h)): follows a domain's Replica Mirror, verifies and stores it and acks it signed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "access-replica"
path = "src/main.rs"

# OP-158 m.3 (dd): public crates only (`dependency-direction`); its copy is its own files
[dependencies]
access-kernel = { workspace = true }
# OP-158 m.3 (h): the open evaluator the replay agent runs
access-verifier = { workspace = true }
suiss-crypto = { workspace = true, features = ["verify", "signer", "aead"] }
suiss-ledger = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true
