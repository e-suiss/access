[package]
name = "access-server"
description = "Access server: authority and identity cores (OP-2). One binary, one mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-authority-ingest = { workspace = true }
access-authority-core = { path = "../../crates/authority-core" }
access-authority-sequencer = { path = "../../crates/authority-sequencer" }
access-crypto = { workspace = true }
access-http = { workspace = true }
access-identity-oidf = { workspace = true }
access-identity-account = { workspace = true }
access-identity-federation = { workspace = true }
access-identity-vault = { workspace = true }
access-identity-x509 = { workspace = true }
access-identity-admin = { workspace = true }
access-identity-events = { workspace = true }
access-identity-oauth = { workspace = true }
access-identity-domain = { workspace = true }
access-identity-proxy = { workspace = true }
access-identity-export = { workspace = true }
access-identity-attest = { workspace = true }
access-identity-edge = { workspace = true }
access-identity-scim = { workspace = true }
access-identity-saml = { workspace = true }
access-identity-signer = { path = "../../crates/identity-signer" }
access-identity-ssh = { workspace = true }
access-edge-core = { workspace = true, features = ["channel"] }
access-identity-risk = { workspace = true }
access-identity-session = { workspace = true }
access-identity-hooks = { workspace = true }
access-identity-audit = { path = "../../crates/identity-audit" }
access-identity-ui = { workspace = true }
access-identity-webauthn = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
access-store = { workspace = true }
# OP-105, OP-157 m.3 (n)
restriction-analysis = { package = "esuiss-restriction-analysis", path = "../../crates/restriction-analysis" }
suiss-crypto = { workspace = true, features = ["pkcs11", "signer"] }
suiss-sandbox = { workspace = true }
suiss-ledger = { workspace = true, features = ["doorbell"] }
access-telemetry = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
figment = { workspace = true, features = ["env", "toml"] }
rustls-pki-types = { workspace = true, features = ["std"] }
rustls-webpki = { workspace = true, features = ["aws-lc-rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { workspace = true, features = ["util"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["alloc", "std"] }

[dev-dependencies]
access-identity-domain = { workspace = true, features = ["testing"] }
access-identity-export = { workspace = true, features = ["testing"] }
access-experience = { workspace = true }
access-executor = { path = "../../services/executor", features = ["testing"] }
access-mcp-gateway = { path = "../../services/mcp-gateway" }
access-vc-verifier = { path = "../../services/vc-verifier", features = ["testing"] }
# OP-156 m.2 Q14
access-hr-connector = { path = "../../services/hr-connector", features = ["testing"] }
# OP-156 m.2 Q1
access-product-twin = { path = "../../services/product-twin" }
# OP-156 m.3 (u)
access-verifier = { workspace = true, features = ["testing"] }
# OP-156 m.3 (p)
access-linux-client = { path = "../../services/linux-client" }
access-linux-module = { path = "../../services/linux-client/module" }
# OP-156 m.3 (m)
access-proxy = { path = "../../services/proxy" }
access-sdk = { workspace = true, features = ["mcp"] }
access-authority-signer = { path = "../../crates/authority-signer" }
access-crypto = { workspace = true, features = ["testing"] }
access-identity-account = { workspace = true, features = ["testing"] }
access-identity-signer = { path = "../../crates/identity-signer" }
access-identity-x509 = { workspace = true, features = ["testing"] }
access-identity-oidf = { workspace = true, features = ["testing"] }
access-identity-signals = { workspace = true }
access-local-client = { path = "../access-local-client" }
access-store = { workspace = true, features = ["testing"] }
aws-lc-rs = { workspace = true }
ed25519-dalek = { workspace = true }
http-body-util = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
saml-idp-suite = { workspace = true }
suiss-crypto = { workspace = true, features = ["testing"] }
suiss-ledger = { workspace = true, features = ["testing"] }
tower = { workspace = true, features = ["util"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[lints]
workspace = true
