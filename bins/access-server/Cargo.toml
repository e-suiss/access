[package]
name = "access-server"
description = "Access server: authority and identity cores (OP-2). One binary, one mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-http = { workspace = true }
access-sandbox = { workspace = true }
access-telemetry = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
figment = { workspace = true, features = ["env", "toml"] }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { workspace = true, features = ["std"] }

[lints]
workspace = true
