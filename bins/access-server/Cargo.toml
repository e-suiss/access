[package]
name = "access-server"
description = "Access server: authority and identity cores (OP-2). One binary, one mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
access-authority-ingest = { workspace = true }
access-authority-core = { path = "../../crates/authority-core" }
access-authority-sequencer = { path = "../../crates/authority-sequencer" }
access-crypto = { workspace = true }
access-http = { workspace = true }
access-identity-account = { workspace = true }
access-identity-admin = { workspace = true }
access-identity-events = { workspace = true }
access-identity-oauth = { workspace = true }
access-identity-session = { workspace = true }
access-identity-ui = { workspace = true }
access-identity-webauthn = { workspace = true }
access-internal-api = { workspace = true }
access-kernel = { workspace = true }
access-store = { workspace = true }
suiss-crypto = { workspace = true, features = ["pkcs11"] }
suiss-sandbox = { workspace = true }
access-telemetry = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
figment = { workspace = true, features = ["env", "toml"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
access-authority-signer = { path = "../../crates/authority-signer" }
access-crypto = { workspace = true, features = ["testing"] }
access-identity-signer = { path = "../../crates/identity-signer" }
access-store = { workspace = true, features = ["testing"] }
aws-lc-rs = { workspace = true }
ed25519-dalek = { workspace = true }
http-body-util = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
suiss-crypto = { workspace = true, features = ["testing"] }
tower = { workspace = true, features = ["util"] }
zeroize = { workspace = true, features = ["alloc", "std"] }

[lints]
workspace = true
