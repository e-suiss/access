[package]
name = "esuiss-access-verify"
description = "Reference Verifier (CMP-17, TI-17): offline verification of Access artefacts with the open Kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "access-verify"
path = "src/main.rs"

[dependencies]
access-kernel = { workspace = true }
access-verifier = { workspace = true }
suiss-crypto = { workspace = true, features = ["verify"] }

[dev-dependencies]
miniz_oxide = { workspace = true }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
