# SA-53, OP-159 m.3 (ii), §17.6.7, §18.2, §18.6, H17
# NIST SP 800-53 Rev. 5, the controls FedRAMP baselines draw on for identity, audit and
# cryptography. Audit export maps AU-9 and AU-10 with the streamed export, checkpoints and the
# 12-month base window (OP-158 m.3 (w)).

version = 1
framework = "NIST SP 800-53"
edition = "Rev. 5, FedRAMP baseline source"

[[control]]
control = "AU-2"
status = "met"
rules = ["U53", "OPI-6"]
tests = ["crates/identity-audit/tests/audit.rs::op_44_the_operational_stream_is_a_separate_chain"]
note = "The audit taxonomy names every event written; security changes and their records share one transaction."

[[control]]
control = "AU-3"
status = "met"
rules = ["G14"]
tests = ["crates/identity-export/src/domain/fields.rs::the_ocsf_version_is_pinned_and_every_record_field_is_aligned"]
note = "Each record names its actor, action, target, outcome and time in a pinned OCSF schema."

[[control]]
control = "AU-6"
status = "partial"
rules = ["U53"]
tests = ["bins/access-server/src/bootstrap/tests/management.rs::the_audit_stream_is_served_in_three_renderings_and_each_read_is_audited"]
note = "The stream is readable and exportable to a SIEM; review and analysis are the operator's."

[[control]]
control = "AU-9"
status = "met"
rules = ["U52", "U70", "N-56"]
tests = [
  "crates/identity-audit/tests/audit.rs::checkpoints_cannot_fork_or_change",
  "crates/identity-export/tests/pass.rs::every_row_reaches_every_sink_as_a_copy_and_a_sink_that_is_down_loses_nothing",
]
note = "Audit rows are in signed checkpoints and streamed to separate sinks; a database change before a checkpoint is not detected (N-56)."

[[control]]
control = "AU-10"
status = "met"
rules = ["G14", "U52"]
tests = [
  "crates/http/tests/admin_realm.rs::an_audit_event_proves_its_inclusion_in_the_realm_tree",
  "bins/access-server/src/publication/tests.rs::an_identity_audit_row_is_in_a_signed_checkpoint_at_its_publication_target",
]
note = "Each event has an inclusion proof in its realm's tree, and actions are attributed by the actor's signed statement."

[[control]]
control = "AU-11"
status = "partial"
rules = ["U52"]
tests = [
  "crates/identity-export/tests/cold_tier.rs::a_due_partition_moves_to_the_cold_tier_verified_and_detached",
  "crates/identity-export/tests/tiles.rs::every_ended_year_is_frozen_once",
]
note = "Records are kept: 12 months by default, then a verified cold archive (OP-73); longer hot windows are a realm's audit tier."

[[control]]
control = "AU-12"
status = "met"
rules = ["U53"]
tests = ["crates/authority-core/tests/commit.rs::u53_op_44_every_audit_read_is_one_row"]
note = "Records are generated by the product itself, including reads of the audit log."

[[control]]
control = "IA-2"
status = "met"
rules = ["SEC10", "IDI-7"]
tests = [
  "crates/identity-session/tests/signin.rs::required_mfa_without_a_second_factor_never_signs_in",
  "crates/identity-webauthn/tests/ceremony.rs::es256_device_bound_passkey_registers_and_authenticates_at_aal3",
]
note = "Users sign in with one or more factors as the realm requires."

[[control]]
control = "IA-2(8)"
status = "met"
rules = ["G57"]
tests = ["crates/identity-session/tests/signin.rs::totp_is_required_once_enrolled_and_cannot_be_replayed"]
note = "One-time codes and WebAuthn challenges are single-use."

[[control]]
control = "IA-5(1)"
status = "met"
rules = ["U69"]
tests = [
  "crates/identity-account/tests/accounts.rs::breached_or_unchecked_passwords_are_refused",
  "crates/identity-account/src/domain/password/tests.rs::phc_round_trip_and_rehash",
]
note = "Passwords are screened, hashed with Argon2id and rehashed when parameters rise."

[[control]]
control = "AC-7"
status = "met"
rules = ["U46"]
tests = ["crates/identity-account/tests/accounts.rs::a_hundred_failures_lock_the_account"]
note = "Consecutive failures wait longer each time and lock at 100."

[[control]]
control = "AC-12"
status = "met"
rules = ["G57"]
tests = ["crates/http/tests/console.rs::idle_sessions_end_after_fifteen_minutes"]
note = "Sessions end at their idle and absolute limits."

[[control]]
control = "SC-8"
status = "met"
rules = ["SEC4"]
tests = [
  "crates/http/tests/pebble.rs::pebble_issues_a_certificate_over_tls_alpn_and_the_listener_serves_it",
  "crates/http/tests/tls.rs::tls_13_with_the_hybrid_group",
  "crates/http/tests/tls.rs::an_ml_dsa_certificate_is_refused_at_start",
]
note = "Every listener serves TLS 1.3 with the hybrid key exchange group; TLS 1.2 and an ML-DSA certificate on browser-facing TLS are refused."

[[control]]
control = "SC-12"
status = "met"
rules = ["TNI-2", "U42"]
tests = [
  "crates/identity-signer/src/app/tests.rs::rotation_runs_without_gaps",
  "crates/suiss-crypto/src/pkcs11/tests.rs::token_keys_sign_and_are_found_again",
]
note = "Signing keys live in the signer process or an HSM and rotate without gaps."

[[control]]
control = "SC-13"
status = "partial"
rules = ["SEC4"]
tests = [
  "crates/suiss-crypto/src/pkcs11/tests.rs::token_aead_seals_and_opens",
  "bins/access-server/src/bootstrap/tests/durability/hybrid.rs::a_hybrid_receipt_from_the_real_server_verifies_only_with_both_components",
  "crates/crypto/tests/differential.rs::an_ml_dsa_cose_sign1_verifies_only_with_a_provider",
]
note = "Classical algorithms through aws-lc-rs and PKCS#11; a hybrid receipt verifies only with both components and the ML-DSA COSE layer needs a provider. The FIPS 140-3 build profile and realm post-quantum keys wait on lane J3; the FIPS image builds on CI only."

[[control]]
control = "SC-28"
status = "met"
rules = ["U58", "U69"]
tests = [
  "crates/authority-sequencer/tests/bodies.rs::kek_rotation_rewraps_live_bodies",
  "crates/store/tests/accounts.rs::shredding_removes_every_key_and_keeps_the_rows",
]
note = "Personal data is sealed under per-subject keys wrapped by a KEK; destroying the key makes it unreadable."
