# A secret store (OpenBao, HashiCorp Vault, a cloud secret manager, …) as a seam (E22, E36,
# §7.9.12.4, OP-156 m.3 (x)). The store keeps the secret and is its own PEP; Access decides
# whether it may leave. A release is `secret.release` on one `secret:[mount, path…]` and happens
# only for the release Exercise, once (`esuiss-access-sdk` `resource::release`).
product = "Secret store"
namespace = "secret"
catalog_version = 1
truth = ["secret value", "secret version", "lease"]

[[actions]]
name = "release"
major = 1
effect_class = "irreversible"
reversibility = "irreversible"
resource_types = ["secret"]
render = "Release a secret"
