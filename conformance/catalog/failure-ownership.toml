# XI-20, §7.9.14, §16.7, §16.7.1, OP-158 m.3 (t): who owns each failure and what the user is told.
#
# plane         "authority" or "identity"
# failure       the failure, as the §16.7 / §16.7.1 tables name it
# owner         who is responsible: access, operator, domain, idp, relay, executor, provider, verifier
# unknown       what cannot be known yet (shown as UNKNOWN)
# missing       the information that is not available
# safe_default  the fail-closed default shown until it is known
# text          the Fluent message the surfaces show for it
# tests         the fault-injection tests that prove the row (path::fn)
# pending       for a row whose test belongs to another lane: what it waits for

version = 1

[[failure]]
id = "FO-01"
plane = "authority"
failure = "leader crash before or after commit"
owner = "access"
unknown = "whether the commit landed before the crash"
missing = "the outcome of the request in flight"
safe_default = "the client asks again with the same nonce; nothing is done twice (TI-8)"
text = "outcome-not_confirmed_checking"
tests = ["bins/access-server/src/bootstrap/tests.rs::a_one_shot_change_commits_while_another_process_leads", "bins/access-server/src/bootstrap/tests/authzen.rs::the_cbor_and_json_forms_give_the_same_decision_record"]

