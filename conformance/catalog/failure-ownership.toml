# XI-20, §16.7, §16.7.1, OP-158 m.3 (t): who owns each failure and what the user is told.
#
# plane        "authority" or "identity"
# failure      the failure, as the §16.7 / §16.7.1 tables name it
#
# Lane W8 adds, per failure: owner, unknown (what cannot be known yet), missing (the
# information that is not available), safe_default and the fault-injection test that proves the
# row (bins/access-server/src/bootstrap/tests/faults/).

version = 1

[[failure]]
id = "FO-01"
plane = "authority"
failure = "leader crash before or after commit"

