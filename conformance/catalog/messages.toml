# Fluent key. `class` and `owner` follow §8.15.2; `protected` keys (enumeration-sensitive,
# guarantee-bearing or owner-attributing) are never overridden by a realm (X35, XI-25); a
# guarantee-bearing text names exactly one §3.3 class (SEC2). `text_id` is the login node
# contract's wire id when the text is a TextId. Checked by `cargo xtask check` (fluent-catalog).

