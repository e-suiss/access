# The binding UI glossary (§8.8, §8.9, §8.11, X24, XI-13, TN-108, OP-153 m.3 (s)): one canonical
# concept, one term per language, and one concept per term. A new language is a new column.
# `banned` lists words no end-user text says (login, account, hub and mail surfaces); the console
# is developer and admin UI and may name realms. `classes` narrows a ban to messages of those
# classes. Checked over every `locales/*/*.ftl` by `cargo xtask check` (fluent-catalog).

