# §8.9, §8.11, X24, X33, OP-153 m.2 N0 (Ek B 3591–3593, 3715–3717)

[[banned]]
en = ["tenant", "tenants", "realm", "realms", "cell", "cells", "session", "sessions", "mandate", "mandates", "merged", "trusted", "verified", "forever", "undo", "nonce", "holdingref", "validitycontract", "tenant_id", "realm_id", "acr", "amr", "sub", "dpop", "dbsc", "jti", "token", "tokens", "impersonate", "impersonation"]
tr = ["kiracı", "kiracılar", "realm", "hücre", "oturum", "oturumlar", "birleştirildi", "güvenilir", "doğrulanmış", "sonsuza", "nonce", "token"]
reason = "Never shown to an end user (§8.9, §8.11): tenancy and protocol names, and the words §8.10 forbids."

[[banned]]
en = ["allow", "authorize", "authorise"]
tr = ["izin ver", "yetkilendir"]
classes = ["consent"]
reason = "A claim release or a delegation preview never says Allow or Authorize (§8.8, §8.11, X27)."
