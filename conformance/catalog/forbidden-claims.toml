# §3.1d
# B2, B3, B5, §1.4, §3.3a, §8.10, §13.8, §15.1.2, §18.2
# CR-50, F-17, SA-12, SA-38, SA-50, OP-79, B15, B20, D4, SAI-1

[scan]
docs = ["*.md", "*.mdx", ".github/**", "web/**", "sdks/**"]
ui = ["web/**", "sdks/**", "**/locales/**", "**/i18n/**"]
exclude = ["docs/**", "target/**", "**/node_modules/**", "conformance/catalog/**", "xtask/**", "CLAUDE.md"]
extensions = ["md", "mdx", "txt", "html", "ts", "tsx", "js", "jsx", "json", "yml", "yaml", "ftl", "po", "vue", "svelte"]

[vocab]
competitor = [
  "Keycloak", "Okta", "Auth0", "Entra", "Azure AD", "Ping", "ForgeRock", "Cognito", "Zitadel",
  "Ory", "Hydra", "Authentik", "Authelia", "Kanidm", "Rauthy", "FusionAuth", "Logto", "Casdoor",
  "WorkOS", "Clerk", "Stytch", "Descope", "SpiceDB", "OpenFGA", "Cerbos", "Permit.io",
  "any other IdP", "other identity providers",
]

[benchmark]
units = [
  "µs", "μs", "ns", "ms", "req/s", "requests/s", "requests per second", "rps", "qps", "tps",
  "ops/s", "logins/s", "logins per second", "tokens/s", "decisions/s", "x faster", "× faster",
  "times faster", "% faster", "x slower", "× slower",
]
markers = ["pending reproduction", "benches/"]

# CR-50, MD-15, B15, §3.3a, §15.1.2

[[claim]]
id = "formally-verified"
scope = "all"
phrases = ["formally verified", "formally proven", "formal verification guarantees", "mathematically proven secure"]
negation = true
sources = ["§3.3a", "§15.1.2", "CR-50", "B15", "MD-15"]
honest = "Name the scope: which property of which model is machine-checked with which tool, and what is outside it."

[[claim]]
id = "proven-secure"
scope = "all"
phrases = ["proven secure", "provably secure", "proven to be secure", "unhackable", "100% secure"]
negation = true
sources = ["CR-50", "§15.1.2", "B15"]
honest = "State the guarantee class and the declared limits of each claim (§3.3)."

[[claim]]
id = "constant-time-guaranteed"
scope = "all"
phrases = [
  "constant-time guaranteed", "guaranteed constant-time", "guaranteed constant time", "proven constant-time",
  "proven constant time", "immune to timing attacks", "no timing leaks", "zero timing leakage",
]
negation = true
sources = ["CR-50", "§15.1.2", "§13.8", "HL-16"]
rows = ["N-46"]
honest = "Measured as constant-time (dudect / asm snapshot); the compiler gives no guarantee."

[[claim]]
id = "quantum-safe"
scope = "all"
phrases = ["quantum-safe", "quantum safe", "quantum-resistant", "quantum resistant", "quantum-proof", "post-quantum secure"]
allow = ["re-anchor"]
negation = true
sources = ["CR-50", "§13.8", "§15.20"]
rows = ["N-37", "N-55"]
honest = "Re-anchored records are verifiable at a verifier that trusted the PQ anchor before the break; later records are not covered."

[[claim]]
id = "compiler-tenant-isolation"
scope = "all"
phrases = [
  "compiler guarantees tenant isolation", "tenant isolation is guaranteed by the compiler",
  "isolation is guaranteed by the compiler", "compiler-guaranteed isolation", "compiler-guaranteed tenant isolation",
]
negation = true
sources = ["§3.3a", "§8.10", "§13.8", "§16.4.3", "B15"]
honest = "Queries without a tenant/domain scope don't compile; isolation is additionally enforced by row-level security."

[[claim]]
id = "secure-because-rust"
scope = "all"
phrases = [
  "secure because it is written in rust", "secure because it's written in rust", "rust makes it secure",
  "rust guarantees security", "memory safety makes it secure",
]
negation = true
sources = ["§3.3a", "CR-50"]
honest = "Name the specific defect classes Rust's type system rules out; the rest is covered by tests and review."

[[claim]]
id = "slsa-level"
scope = "all"
phrases = ["slsa l3", "slsa level 3", "slsa build l3", "slsa build level 3", "slsa l4", "source l4", "slsa source level 4", "slsa certified"]
allow = ["target", "not claimed", "not verified", "unverified"]
negation = true
sources = ["F-17", "SA-38", "§13.8"]
rows = ["U49"]
honest = "Release provenance is signed (attest-build-provenance); the SLSA level is not verified and not used in marketing."

[[claim]]
id = "reproducible-builds"
scope = "all"
phrases = ["reproducible builds", "reproducible build", "reproducibly built", "bit-for-bit reproducible", "byte-for-byte reproducible"]
allow = ["not guaranteed", "not committed", "not a guarantee", "not a release gate", "informational", "best effort", "goal", "target"]
negation = true
sources = ["OP-79", "OP-49", "U50", "SAI-7"]
rows = ["U50", "SAI-7"]
honest = "Builds are made easier to reproduce (pinned toolchain, --locked, path remap); a second build is compared for information only."

[[claim]]
id = "audited-means-secure"
scope = "all"
phrases = ["audited = secure", "audited and therefore secure", "certified secure"]
negation = true
sources = ["§13.8"]
honest = "An independent audit was performed on <date>; the report is here."

[[claim]]
id = "cra-compliant"
scope = "all"
phrases = ["cra compliant", "cra-compliant", "cra certified", "compliant with the cyber resilience act"]
allow = ["readiness", "preparation", "preparing"]
negation = true
sources = ["§13.8", "SA-48"]
honest = "CRA readiness: SBOM, CVD process and support period are published."

[[claim]]
id = "tamper-proof"
scope = "all"
phrases = ["tamper-proof", "tamperproof", "tamper proof"]
negation = true
sources = ["§13.8"]
honest = "Tamper-evident (checked against independent witnesses) — only where witnesses are configured."

