  "Access authorizes the payment", "ALLOW reserves the funds",
]
negation = true
sources = ["§7.9.9.3", "E21"]
honest = "ALLOW means the actor may ask for the payment; Pay's authorization means the issuer or acquirer reserved the money."

[[claim]]
