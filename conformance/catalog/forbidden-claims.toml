scope = "all"
phrases = [
  "active-active", "zero rpo with async replication", "row-level restore", "per-tenant restore",
  "automatic cross-region failover",
]
negation = true
sources = ["OP-24", "OP-57", "HL-32", "SA-47", "§17.4"]
honest = "One sequencer leader writes each domain; synchronous standbys give RPO 0 inside a cluster, async DR is declared with its RPO, and restore is per cluster, not per row or tenant."

[[claim]]
id = "w8-always-available"
scope = "all"
phrases = [
  "guaranteed uptime", "never goes down", "works even when the database is down",
  "grace window allows access",
]
negation = true
sources = ["TI-9", "SEC27", "OP-45", "§16.7"]
honest = "When a dependency fails, Access refuses or answers 503 with Retry-After; already-issued self-contained tokens keep working within their declared lifetime."

[[claim]]
id = "w9-data-never-leaves"
scope = "all"
phrases = [
  "data never leaves turkey", "certified turkish region", "dedicated hardware for every tenant",
]
negation = true
sources = ["CMP-26", "OP-30", "T28", "§17.1"]
honest = "Residency is the cell region the domain and realm declare; it is published with the DR class and the RPO."

[[claim]]
id = "w10-unmeasured-throughput"
scope = "all"
phrases = [
  "unmeasured throughput", "millions of decisions per second", "unlimited scale", "cached allow",
]
negation = true
sources = ["OP-32", "OP-61", "OP-72", "U61", "§9.7A"]
honest = "Performance figures are published only with the measurement, its environment and its git version; the decision cache speeds advisory checks and is never a source of ALLOW."

[[claim]]
id = "w11-unlimited-requests"
scope = "all"
phrases = [
  "unlimited requests", "no rate limits", "limits never apply to revocation",
]
negation = true
sources = ["T27", "OP-35", "OP-36", "§13.7.4"]
honest = "Limits and quotas reject widening requests per tenant, realm and domain; narrowing actions, export, handover and recovery are never counted against them."

[[claim]]
id = "w12-audit-kept-forever"
scope = "all"
phrases = [
  "audit logs are kept forever", "audit logs are never archived", "we delete old audit logs",
]
negation = true
sources = ["OP-37", "OP-40", "OP-73", "§17.6"]
honest = "Audit history is queryable online for 12 months (hot PostgreSQL plus queryable cold storage) and archived after that; nothing is physically deleted."

[[claim]]
id = "w13-fips-everywhere"
scope = "all"
phrases = [
  "fips certified by default", "keys never leave memory unencrypted", "suiss can read your user-keyed data",
]
negation = true
sources = ["CR-15", "CR-34", "CR-36", "§10.1"]
honest = "The FIPS profile is chosen per realm or domain; operational keys live in protected memory where the kernel supports it, and user-keyed data is sealed with keys on the user's devices."

# OP-159 m.3 (qq), m.4 (a)

[[claim]]
id = "j1-one-signature-enough"
scope = "all"
phrases = ["either signature is enough", "composite signatures supported", "accepts the classical signature alone"]
negation = true
sources = ["CR-42", "SAI-44", "OP-159 m.3 (c)", "OP-159 m.3 (e)"]
honest = "Under the both policy a verifier requires both the classical and the ML-DSA signature; composite identifiers are refused."

[[claim]]
id = "j1-ml-dsa-everywhere"
scope = "all"
phrases = ["the wasm verifier checks ml-dsa", "mobile verifiers accept ml-dsa", "ml-dsa on every verifier"]
negation = true
sources = ["CR-41", "OP-159 m.3 (c)"]
honest = "The Wasm and mobile verifiers refuse ML-DSA artefacts and declare it in their Verifier Profile; a pq-only domain's artefacts are not accepted there."

[[claim]]
id = "j2-cnsa-compliant"
scope = "all"
phrases = ["cnsa 2.0 compliant", "cnsa 2.0 compliance", "cnsa-compliant"]
negation = true
sources = ["CR-1", "OP-159 m.3 (e)"]
honest = "The ML-DSA-87 profile signs with ML-DSA-87; the digest base stays SHA-256, and no CNSA 2.0 conformance is claimed."

[[claim]]
id = "j2-history-resigned"
scope = "all"
phrases = ["records are re-signed", "history is re-signed", "old records become post-quantum"]
negation = true
sources = ["CR-45", "OP-159 m.3 (f)", "OP-159 m.3 (g)"]
honest = "Records are never re-signed; a post-quantum re-anchor checkpoint covers them for verifiers that pinned its anchor before the break."

[[claim]]
id = "j3-post-quantum-login"
scope = "all"
phrases = ["post-quantum login", "post-quantum sign-in", "post-quantum tokens for everyone"]
negation = true
sources = ["HL-19", "OP-159 m.3 (o)"]
honest = "ML-DSA tokens are issued only to clients that register for them; sign-in credentials and passkeys stay classical."

[[claim]]
id = "j3-fips-validated"
scope = "all"
phrases = ["fips 140-3 validated", "fips-validated build", "fips 140-3 certified"]
allow = ["-fips image", "fips build"]
negation = true
sources = ["CR-15", "CR-44", "HL-27", "OP-159 m.3 (r)"]
honest = "Only the FIPS build runs the validated module; every other build publishes fips_module false."

[[claim]]
id = "j4-no-side-channels"
scope = "all"
phrases = ["no side channels", "side-channel free", "timing-attack proof"]
negation = true
sources = ["CR-39", "CR-40", "HL-16", "OP-159 m.3 (s)"]
honest = "Constant-time points are listed and measured on an isolated runner; padding and DIT reduce leakage, they do not remove it."

[[claim]]
id = "j4-pq-only-tls"
scope = "all"
phrases = ["post-quantum tls only", "classical key exchange is disabled", "pq-only tls"]
negation = true
sources = ["CR-12", "OP-159 m.3 (t)"]
honest = "TLS offers the hybrid X25519MLKEM768 group and keeps the classical groups; the realm's share policy decides only their order."

[[claim]]
id = "j5-proven-kernel"
scope = "all"
phrases = ["the kernel is proven in lean", "lean proves the implementation", "proven kernel"]
negation = true
sources = ["CR-48", "CR-50", "OP-159 m.3 (v)"]
honest = "The Lean model of the constraint algebra is machine-checked and compared with the Kernel by differential testing; the Rust code itself is not proven."

[[claim]]
id = "j6-formally-verified-access"
scope = "all"
phrases = ["formally verified access", "verified by kani", "model-checked system"]
negation = true
sources = ["CR-46", "CR-50", "MD-15", "OP-159 m.3 (y)"]
honest = "Property P of model M is machine-checked (Lean/Kani/TLA+); see scope."

[[claim]]
id = "j7-bug-free"
scope = "all"
phrases = ["fuzzed and bug-free", "fuzzing proves", "memory safety guaranteed"]
negation = true
sources = ["SA-59", "MD-2", "OP-159 m.3 (bb)", "OP-159 m.3 (cc)"]
honest = "Fuzzing, simulation and sanitizers find classes of bugs within their corpus and run time; they prove nothing about inputs they never saw."

[[claim]]
id = "j9-compliance-guaranteed"
scope = "all"
phrases = ["compliance guaranteed", "pci dss compliant", "nis2 compliant", "dora compliant", "asvs certified"]
negation = true
sources = ["SA-53", "IDP-9", "OP-159 m.3 (ii)"]
honest = "A mapping lists which controls the catalog's guarantees and tests back; statutory conformity is not guaranteed."

[[claim]]
id = "j10-paid-fixes"
scope = "all"
phrases = ["security fixes for subscribers only", "fixes only in the paid edition", "security support is a paid add-on"]
negation = true
sources = ["B20", "OP-159 m.3 (jj)"]
honest = "Security fixes ship in the open-source release from main or a release branch; paid support is early notice inside an embargo and help applying fixes."

[[claim]]
id = "j10-supported-forever"
scope = "all"
phrases = ["supported forever", "lifetime security updates", "every version is supported"]
negation = true
sources = ["OP-68", "OP-159 m.3 (jj)"]
honest = "Each major receives security fixes for at least five years from its release; within a major, the last two minors receive them."

[[claim]]
id = "j11-attestation-proves-device"
scope = "all"
phrases = ["attestation proves the device is uncompromised", "attested authenticators cannot be cloned", "post-quantum attestation"]
negation = true
sources = ["HL-19", "OP-159 m.3 (ll)"]
honest = "Attestation names the authenticator model and its certificate chain under the direct policy; it says nothing about the device's later state."

# OP-159 m.3 (gg), (hh), m.4 (b) (J8)

[[claim]]
id = "j8-hl10-merkle-position-private"
scope = "all"
phrases = ["inclusion proofs reveal nothing", "merkle proofs hide the position", "position-hiding inclusion proof"]
negation = true
sources = ["HL-10", "§13.5", "OP-159 m.3 (gg)"]
rows = ["HL-10"]
honest = "An inclusion proof reveals the record's position (its leaf index) in the log and the log size."

[[claim]]
id = "j8-hl11-status-list-anonymous"
scope = "all"
phrases = ["status lists are anonymous", "status checks reveal nothing", "unlinkable status checks"]
negation = true
sources = ["HL-11", "§13.5", "OP-159 m.3 (gg)"]
rows = ["HL-11"]
honest = "A status list hides a token only among the other entries of the same list; the herd is never larger than the list."

[[claim]]
id = "j8-hl12-identical-everywhere"
scope = "all"
phrases = ["every implementation decides identically", "identical decisions across all implementations", "bit-for-bit identical on all inputs"]
negation = true
sources = ["HL-12", "§13.5", "OP-159 m.3 (gg)"]
rows = ["HL-12"]
honest = "Implementations agree on the published test vectors and the differential runs; beyond their coverage agreement is not guaranteed."

[[claim]]
id = "j8-hl15-verified-runtime"
scope = "all"
phrases = ["verified async runtime", "the async runtime is proven", "the http layer is proven"]
negation = true
sources = ["HL-15", "§13.5", "OP-159 m.3 (gg)"]
rows = ["HL-15"]
honest = "The async runtime and the HTTP layer are outside the formal models; fuzzing, deterministic simulation and tests cover them."

[[claim]]
id = "j8-hl16-constant-time-hardware"
scope = "all"
phrases = ["constant-time on every cpu", "the cpu guarantees constant time", "constant time on any hardware"]
negation = true
sources = ["HL-16", "§13.5", "OP-159 m.3 (gg)"]
rows = ["HL-16"]
honest = "Constant-time code is measured (dudect, ctgrind, assembly snapshots); neither the compiler nor the CPU guarantees it."

[[claim]]
id = "j8-hl17-cotenant-immune"
scope = "all"
phrases = ["immune to co-tenant side channels", "side-channel-free hosting", "co-tenant side channels are impossible"]
negation = true
sources = ["HL-17", "DL-10", "§13.5", "OP-159 m.3 (gg)"]
rows = ["HL-17"]
honest = "On shared hardware co-tenant side channels remain possible; dedicated compute is the option that removes them."

[[claim]]
id = "j8-hl19-pq-passkeys"
scope = "all"
phrases = ["post-quantum passkeys", "passkeys are post-quantum", "pqc passkeys"]
negation = true
sources = ["HL-19", "§10.2.4", "OP-159 m.3 (gg)"]
rows = ["HL-19"]
honest = "Passkeys don't use post-quantum cryptography yet; after a cryptographically relevant quantum computer new assertions could be forged."

[[claim]]
id = "j8-hl27-fips-and-pq"
scope = "all"
phrases = ["fips and post-quantum together", "fips-validated post-quantum", "fips with ml-dsa"]
negation = true
sources = ["HL-27", "§15.6", "OP-159 m.3 (gg)"]
rows = ["HL-27"]
honest = "FIPS and post-quantum profiles can't be combined; a realm or domain picks one of them."

[[claim]]
id = "j8-hl29-whole-system-proven"
scope = "all"
phrases = ["fully verified system", "verified end to end", "the whole system is proven"]
negation = true
sources = ["HL-29", "CR-50", "OP-159 m.3 (gg)"]
rows = ["HL-29"]
honest = "Property P of model M is machine-checked (Lean, Kani or TLA+); see the formal scope for what is outside it."

[[claim]]
id = "j8-hl34-late-reanchor"
scope = "all"
phrases = ["re-anchor after the key is compromised", "re-anchoring rescues a compromised key", "re-anchor any time"]
negation = true
sources = ["HL-34", "§15.18", "OP-159 m.3 (gg)"]
rows = ["HL-34"]
honest = "A binding re-anchor protects history only when it happens before the old binding key is compromised."

[[claim]]
id = "j8-hl35-golden-saml-proof"
scope = "all"
phrases = ["golden saml proof", "immune to golden saml", "forged assertions are impossible"]
negation = true
sources = ["HL-35", "§13.2", "OP-159 m.3 (gg)"]
rows = ["HL-35"]
honest = "Whoever holds a leaked realm signing key can forge ID tokens and SAML assertions for that realm until the key is rotated out of the JWKS and the metadata."

[[claim]]
id = "j8-hl36-cimd-permanent"
scope = "all"
phrases = ["cimd clients can't be taken over", "a client id url always belongs to its owner", "client identity takeover is impossible"]
negation = true
sources = ["HL-36", "§11", "OP-159 m.3 (gg)"]
rows = ["HL-36"]
honest = "A CIMD client is whoever controls its domain; an expired or resold domain hands the client identity to the new owner until the realm policy drops that domain."

[[claim]]
id = "j8-endorsed-by-suiss"
scope = "all"
phrases = ["endorsed by suiss", "suiss-endorsed", "suiss endorsement", "approved by suiss"]
negation = true
sources = ["§9.1", "§9.17", "B9", "P2", "OP-159 m.3 (gg)"]
honest = "Passing the conformance suite is a published test result; it needs no Suiss account or relationship and is not endorsement."

[[claim]]
id = "j8-suiss-certification"
scope = "all"
phrases = ["suiss certification", "suiss assessment", "suiss certificate of", "certified by a suiss audit"]
negation = true
sources = ["§18.12", "D3", "OP-159 m.3 (gg)"]
honest = "Suiss sells no certification or assessment service; an independent audit report is published as the auditor's report."

[[claim]]
id = "j8-aitm-passkeys"
scope = "all"
phrases = ["passkeys stop session theft", "passkeys make sessions unstealable", "aitm-proof sign-in"]
negation = true
sources = ["SA-12", "N-41", "HL-23", "OP-159 m.3 (hh)"]
rows = ["N-41", "HL-23"]
honest = "A passkey sign-in can't be relayed through a phishing proxy; it does not stop theft of the session or token after sign-in, and password with TOTP can be relayed."
