# OP-68, B20, SA-14, SA-15, SA-16, OP-159 m.3 (jj)
#
# major_support_years  security fixes for each major, from its first release day
# supported_minors     minors of one major that receive fixes
# branch               the maintenance branch pattern a release is tagged from
#
# [disclosure]         coordinated disclosure: embargo and the days to acknowledge and assess
# [[fix_target]]       days from a confirmed report to a released fix, per CVSS v4 severity
# [cra]                CRA Art. 14 reporting periods the PSIRT tool computes
# [[versions]]         one row per released minor, newest first
# [[obligation]]       CRA technical obligations, each met by tests or partial with what is missing
#
# SECURITY.md's "Supported versions" and "Fix times" sections are generated from this file:
# cargo xtask support-policy
# Schema: conformance/schemas/support-policy.schema.json

version = 1
major_support_years = 5
supported_minors = 2
branch = "release/v<major>.<minor>"

[disclosure]
embargo_days = 90
acknowledge_days = 3
assessment_days = 10

[[fix_target]]
severity = "critical"
cvss = "9.0-10.0"
days = 14

[[fix_target]]
severity = "high"
cvss = "7.0-8.9"
days = 30

[[fix_target]]
severity = "medium"
cvss = "4.0-6.9"
days = 60

[[fix_target]]
severity = "low"
cvss = "0.1-3.9"
days = 90

[cra]
early_warning_hours = 24
notification_hours = 72
final_report_vulnerability_days = 14
final_report_incident_months = 1

[[versions]]
version = "0.4"
released = "2026-11-09"
security_until = "2031-10-29"
status = "supported"

[[versions]]
version = "0.3"
released = "2026-11-06"
security_until = "2031-10-29"
status = "supported"

[[versions]]
version = "0.2"
released = "2026-10-30"
security_until = "2026-11-09"
status = "end-of-life"

[[versions]]
version = "0.1"
released = "2026-10-29"
security_until = "2026-11-06"
status = "end-of-life"

[[obligation]]
id = "CRA-T1"
title = "A software bill of materials with every release, free of charge"
source = "Annex I Part II (1), B3"
status = "met"
artefacts = [".github/workflows/release.yml"]
tests = ["xtask/src/rules_support_policy.rs::release_publishes_an_sbom_for_every_binary"]

[[obligation]]
id = "CRA-T2"
title = "A public contact for vulnerability reports (CRA-C1)"
source = "Annex I Part II (5), (6); SA-14"
status = "met"
artefacts = ["SECURITY.md", "security/security.txt", "crates/http/src/security_txt.rs"]
tests = [
  "crates/http/tests/router.rs::security_txt_has_required_fields",
  "xtask/src/rules_security_txt.rs::expires_more_than_a_year_ahead_or_in_the_past_fails",
]

[[obligation]]
id = "CRA-T3"
title = "Coordinated disclosure through GitHub Security Advisories (CRA-C2)"
source = "Annex I Part II (5); SA-14"
status = "met"
artefacts = ["SECURITY.md", "security/advisories/README.md"]
tests = [
  "xtask/src/rules_advisories.rs::a_record_without_a_cvss_v4_vector_fails",
  "xtask/src/rules_advisories.rs::new_writes_an_osv_record_and_both_drafts",
]

[[obligation]]
id = "CRA-T4"
title = "CVE assignment through a CNA and RustSec (CRA-C3)"
source = "SA-15"
status = "partial"
artefacts = ["security/advisories/README.md"]
tests = ["xtask/src/rules_advisories.rs::new_writes_an_osv_record_and_both_drafts"]
needs = "GitHub CNA requests run from the repository's advisory page and RustSec pull requests from a maintainer account; neither account is set up yet"

[[obligation]]
id = "CRA-T5"
title = "Security updates are free, separate and released in the open"
source = "Annex I Part II (7), (8); B20"
status = "met"
artefacts = [".github/workflows/release.yml"]
tests = [
  "xtask/src/rules_support_policy.rs::a_tag_outside_the_supported_minors_fails",
  "xtask/src/rules_support_policy.rs::release_tags_only_from_main_or_a_maintenance_branch",
]

[[obligation]]
id = "CRA-T6"
title = "A published support period for each major"
source = "Art. 13 (8)"
status = "met"
artefacts = ["SECURITY.md", "conformance/catalog/support-policy.toml"]
tests = [
  "xtask/src/rules_support_policy.rs::a_table_that_drifts_from_the_catalog_fails",
  "xtask/src/rules_support_policy.rs::a_support_period_under_five_years_fails",
]

[[obligation]]
id = "CRA-T7"
title = "Early warning, notification and final report of actively exploited vulnerabilities and severe incidents"
source = "Art. 14; SA-16"
status = "partial"
artefacts = ["conformance/catalog/support-policy.toml"]
tests = ["xtask/src/psirt.rs::deadlines_follow_article_14"]
needs = "the ENISA single reporting platform account and the coordinating CSIRT contact"

[[obligation]]
id = "CRA-T8"
title = "Manufacturer role and product class"
source = "D-10, MD-12"
status = "partial"
artefacts = []
tests = []
needs = "the D-10 decision; the default applied until then is manufacturer, Class I important product"
