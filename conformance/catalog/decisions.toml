# OP-81

[[rule]]
id = "SA-6"
family = "SA"
section = "14.2"
status = "decision"
title = "Threat model as code, linked to guarantees and tests in CI"
tests = [
  "xtask/src/catalog.rs::sa_6_threat_without_known_row_is_reported",
]

[[rule]]
id = "SA-14"
family = "SA"
section = "14.4"
status = "decision"
