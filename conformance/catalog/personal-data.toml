[[field]]
column = "access.scim_resources.body_ciphertext"
vault = "profile"
retention = "profile"
basis = "contract"
portable = "observed"
export = true
note = "A SCIM User's attributes as its provisioning client sent them (OP-155 m.3 (g)); never a password."

[[field]]
column = "access.scim_resources.external_index"
vault = "none"
retention = "profile"
basis = "contract"
portable = "derived"
