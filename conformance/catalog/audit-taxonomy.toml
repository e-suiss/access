# OP-41, OP-47, §17.6.8, §17.8.1, CMP-27: Access's own audit event taxonomy.
#
# The canonical audit records are Access's: the authority record (deterministic CBOR) and the
# identity audit row. This file names every event the full-taxonomy audit stream (channel B)
# carries and maps it statically to OCSF and, where one exists, to its CAEP counterpart in the
# action stream (channel A). The mapping is informative (§9.16.1): a copy, not the record (X22).
#
# event          dotted name, as written in the record
# plane          "identity" or "authority"
# class          own taxonomy class
# outcome        "success", "failure" or "unknown"
# fields         record fields every rendering carries besides the common ones
# ocsf_class     OCSF class_uid
# ocsf_activity  OCSF activity_id within that class
# caep           CAEP event type of channel A, or "" when there is none
# webhook        whether the tenant webhook feed carries it as a raw event (IDP-36, IDP-37)

version = 1
ocsf_version = "1.3.0"

# ---------------------------------------------------------------- identity: accounts

[[event]]
event = "account.created"
plane = "identity"
class = "account"
outcome = "success"
fields = ["actor", "target"]
ocsf_class = 3001
ocsf_activity = 1
caep = ""
webhook = true

