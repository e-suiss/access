# The interop lab (IDP-40, OP-155 m.3 (q)): every system Access is tested against, how, and by
# which tests. `cargo xtask check` holds it to its rules (containers pinned by digest, live runs
# name their CI secret, Keycloak never an oracle, every test exists) and `cargo xtask
# interop-table` generates COMPATIBILITY.md from it.
#
# kind: container (pinned image), package (a distribution package on the CI runner), fixture
# (recorded or documented requests) or live (a vendor tenant, run only when `secret` is set).
# A test is `<crate dir>::<test path>` or `script:<file>#<case>`.

version = 1

[[system]]
name = "OpenID Foundation conformance suite"
protocol = "oidc"
role = "certification suite"
kind = "container"
version = "release-v5.3.3"
image = "registry.gitlab.com/openid/conformance-suite@sha256:377ab51f011d821c4b6f7729053e85adf062d691e51a3615f40507fd900a2436"
oracle = true
job = "oidf-conformance"
tests = [
    "script:conformance/oidf/plans.json#oidcc-basic-certification-test-plan",
    "script:conformance/oidf/plans.json#fapi2-security-profile-final-test-plan",
    "script:conformance/oidf/plans.json#fapi2-message-signing-final-test-plan",
    "script:conformance/oidf/plans.json#fapi-ciba-id1-test-plan",
    "script:conformance/oidf/plans.json#oidcc-dynamic-certification-test-plan",
    "script:conformance/oidf/plans.json#oidcc-rp-initiated-logout-certification-test-plan",
    "script:conformance/oidf/plans.json#oidcc-backchannel-rp-initiated-logout-certification-test-plan",
    "script:conformance/oidf/plans.json#oidcc-frontchannel-rp-initiated-logout-certification-test-plan",
    "script:conformance/oidf/plans.json#openid-federation-deployed-entity-test-plan",
]

