# CR-46, CR-50, MD-15, X41, OP-159 m.3 (y)
#
# [[target]]
# target            what is checked: a module, function or model
# tool              lean | kani | tla | drt | planned tool name
# property          the property, in the words of the scope claim
# rules             catalog rows the property carries
# status            planned | modelled | proved | DRT-linked
# assumptions       what the check assumes (bounds, stubs, trusted code)
# scope             what is inside and outside the check
# semantic_version  the Kernel semantic version the check holds for
# evidence          the proof, harness, model and .cfg, or nightly summary that backs the status
#
# [[out_of_scope]]  parts declared outside every model, with the hard limit that says so
#
# Lane J6 fills the targets; xtask `formal-manifest` checks every status against its evidence.
# Schema: conformance/schemas/formal-manifest.schema.json

version = 1

[[target]]
target = "AccessAlgebra: the Grant algebra (⊑, ∩, normalize), delegation and projection"
tool = "lean"
property = "⊑ is a sound, decidable preorder, ∩ is the greatest lower bound up to coverage, normalize is idempotent and keeps coverage, delegation and projection never widen, and the lineage cascade is monotone"
rules = [
  "INV-3",
  "INV-5",
  "INV-8",
  "L0-ALG-5",
  "L0-ALG-51",
  "L0-ALG-52",
  "L0-ALG-70",
  "L0-ALG-73",
  "L0-ALG-75",
  "CR-48 m.1",
]
status = "proved"
assumptions = [
  "only the axioms propext, Classical.choice and Quot.sound (check-axioms.sh); no sorry",
  "the model is a Lean 4 model of the spec, not the Rust code",
]
scope = "the Lean model in conformance/lean; the Rust Kernel is compared with it by vectors and the nightly DRT, which is a test, not a proof"
semantic_version = "kernel-v0.7.0"
evidence = [
  "conformance/lean/proofs.toml#Access.boundLe_refl",
  "conformance/lean/proofs.toml#Access.boundLe_trans",
  "conformance/lean/proofs.toml#Access.withinB_mono",
  "conformance/lean/proofs.toml#Access.boundMeet_le",
  "conformance/lean/proofs.toml#Access.boundMeet_greatest",
  "conformance/lean/proofs.toml#Access.boundNorm_idem",
  "conformance/lean/proofs.toml#Access.boundNorm_within",
  "conformance/lean/proofs.toml#Access.authLe_refl",
  "conformance/lean/proofs.toml#Access.authLe_trans",
  "conformance/lean/proofs.toml#Access.authLe_sound",
  "conformance/lean/proofs.toml#Access.authMeet_le",
  "conformance/lean/proofs.toml#Access.authMeet_greatest",
  "conformance/lean/proofs.toml#Access.authMeet_greatest_wf",
  "conformance/lean/proofs.toml#Access.authNorm_idem",
  "conformance/lean/proofs.toml#Access.authNorm_covers",
  "conformance/lean/proofs.toml#Access.delegation_never_widens",
  "conformance/lean/proofs.toml#Access.chain_never_widens",
  "conformance/lean/proofs.toml#Access.delegation_depth_decreases",
