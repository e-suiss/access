# OP-69, F-13, OP-159 m.46 (h)
pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all -- --check
    - name: biome
      root: web/
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner --config .gitleaks.toml
