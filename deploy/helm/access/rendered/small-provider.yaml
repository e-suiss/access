# Source: access/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: https
          protocol: TCP
        # OP-151 m.3 (b), CMP-15.5: the management hostname has its own ingress route
        - port: management
          protocol: TCP
    # OP-67 m.3: metrics scraping on the internal port only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: internal
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # OP-141 m.18 (g)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: access-db
      ports:
        - port: 5432
          protocol: TCP

