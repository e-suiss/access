# OP-151 m.1 (a)
route:
  receiver: tickets
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # OP-158 m.3 (s): sev-1 pages at once and repeats every 15 minutes
    - matchers: ['severity = "sev-1"']
      receiver: on-call
      group_wait: 0s
      repeat_interval: 15m
    - matchers: ['severity = "page"']
      receiver: on-call
      repeat_interval: 1h
    - matchers: ['severity = "ticket"']
      receiver: tickets

receivers:
  - name: on-call
    webhook_configs:
      - url: http://pager.invalid/replace-me
        send_resolved: true
  - name: tickets
    webhook_configs:
      - url: http://tickets.invalid/replace-me
        send_resolved: true

inhibit_rules:
  - source_matchers: ['alertname = "AccessSequencerFenced"']
    target_matchers: ['alertname = "AccessSequencerCasFailures"']
    equal: []
  - source_matchers: ['alertname = "AccessIdentityDegradedLong"']
    target_matchers: ['alertname = "AccessIdentityDegraded"']
    equal: []
