# OP-67 m.5, OP-151 m.1 (a), OP-47
groups:
  - name: access-sequencer
    rules:
      # §17.8.2, TI-2, FA-13
      - alert: AccessSequencerFenced
        expr: increase(access_sequencer_fence_events_total[5m]) > 0
        labels:
          severity: page
          runbook: sequencer-fenced
        annotations:
          summary: A sequencer leader was fenced off ({{ $labels.reason }})
          description: >-
            A domain leader lost or could not renew its lease and stepped down. Requests to
            the domain wait until a leader holds the lease again.
      - alert: AccessSequencerCasFailures
        expr: increase(access_sequencer_cas_failures_total[5m]) > 0
        labels:
          severity: page
          runbook: sequencer-cas-failure
        annotations:
          summary: A batch commit found the domain head moved under its leader
          description: >-
            Two writers believed they led the same domain. The leader stepped down; the
            fencing held. Find out why two processes led at once.
      - alert: AccessLeaderEpochChurn
        expr: sum(increase(access_leader_epoch_changes_total[15m])) > 20
        for: 15m
        labels:
          severity: ticket
          runbook: leader-epoch-churn
        annotations:
          summary: Sequencer leader epochs change unusually often
          description: >-
            Leases are acquired or handed over more than 20 times in 15 minutes. Leadership
            is flapping between processes.

  - name: access-status-lists
    rules:
      # §17.8.2, SI-7
      - alert: AccessStatusListStale
        expr: access_status_list_iat_age_seconds > 240
        for: 5m
        labels:
          severity: page
          runbook: status-list-stale
        annotations:
          summary: The oldest published status list is {{ $value | humanizeDuration }} old
          description: >-
            Verifiers holding a list older than its TTL treat the tokens it covers as
            unknown. Publication has stopped or is failing.

  - name: access-signers
    rules:
      # §13.9
      - alert: AccessSignerSlow
        expr: >-
          histogram_quantile(0.99,
            sum by (le, plane) (rate(access_signer_call_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: ticket
          runbook: signer-slow
        annotations:
          summary: The {{ $labels.plane }} signer answers slowly (p99 above 500 ms)
          description: >-
            Signing waits on the signer. Tokens, receipts and status lists are delayed.
      - alert: AccessSignerFailing
        expr: >-
          sum by (plane, outcome) (rate(access_signer_call_duration_seconds_count{outcome!="ok"}[5m])) > 0
        for: 5m
        labels:
          severity: page
          runbook: signer-failing
        annotations:
          summary: The {{ $labels.plane }} signer refuses or cannot be reached ({{ $labels.outcome }})
          description: >-
            Signer calls fail. Whatever needs a signature is refused, fail closed.

  - name: access-telemetry
    rules:
      # OP-67, TI-18
      - alert: AccessTelemetryExportFailing
        expr: increase(access_telemetry_export_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: ticket
          runbook: telemetry-export-failing
        annotations:
          summary: OTLP export to the collector fails
          description: >-
            Metrics or traces are not reaching the collector. Decisions are unaffected; the
            dashboards and the other alerts go blind.

  - name: access-risk
    rules:
      # OP-151 m.3 (o), TN-46: the FP budget of SL2 step-up requests is 0.5 %
      - alert: AccessRiskFalsePositiveBudget
        expr: access_risk_fp_ratio_ppm > 5000
        for: 1h
        labels:
          severity: ticket
          runbook: risk-fp-budget
        annotations:
          summary: More than 0.5 % of SL2 step-up requests were marked false positive
          description: >-
            Reviewers marked more than 0.5 % of risk step-up requests of the last 30 days as
            false positives. Keep or move realms back to shadow mode and review the signal
            weights before asking users for more step-ups.

  - name: access-degraded-and-integrity
    rules:
      # OP-45, §17.7.2, OP-158 m.3 (s): 0–60 s alarm (PD)
      - alert: AccessIdentityDegraded
        expr: max(access_identity_degraded_seconds) > 0
        labels:
          severity: page
          runbook: identity-degraded
        annotations:
          summary: The identity database has not answered for {{ $value }} s
          description: >-
            Degraded mode: no new sign-in, refresh, registration, admin write or revocation is
            taken (503 with Retry-After) and introspection answers active=false. Tokens already
            signed are checked by resource servers only within their declared lifetime.
      # OP-45, §17.7.2: > 300 s sev-1 (PD)
      - alert: AccessIdentityDegradedLong
        expr: max(access_identity_degraded_seconds) > 300
        labels:
          severity: sev-1
          runbook: identity-degraded
        annotations:
          summary: The identity database has not answered for more than 5 minutes
          description: >-
            Degraded mode has lasted longer than five minutes. Sign-in and revocation are still
            refused; find why the identity database does not answer.
      # §17.4.4, §17.8.2, FA-13, OP-158 m.3 (n)
      - alert: AccessUnfencedPromote
        expr: increase(access_integrity_alarms_total{kind="unfenced_promote"}[5m]) > 0
        labels:
          severity: sev-1
          runbook: unfenced-promote
        annotations:
          summary: A promote was attempted without fence proof
          description: >-
            Someone tried to promote a database or a cell without proof that the old writer is
            fenced off. Nothing was promoted; two writers must never exist.
      # §17.4.4, §17.8.2, TI-RT1, OP-158 m.3 (i)
      - alert: AccessRebuildDiff
        expr: increase(access_integrity_alarms_total{kind="rebuild_diff"}[5m]) > 0
        labels:
          severity: sev-1
          runbook: rebuild-diff
        annotations:
          summary: The live state of a domain differs from the fold of its records
          description: >-
            Commits to the domain stopped. The fold from Genesis decides; rebuild the live state
            out of the log once the commitments check.
      # U9, HL-7, OP-158 m.3 (d)
      - alert: AccessWitnessEquivocation
        expr: increase(access_integrity_alarms_total{kind="equivocation"}[5m]) > 0
        labels:
          severity: sev-1
          runbook: witness-equivocation
        annotations:
          summary: Two cosigned checkpoints of one size have different roots
          description: >-
            The signed equivocation evidence is kept. A log showed two different histories;
            treat the domain's provider as suspect.
  - name: access-transport
    rules:
      # CR-12 m.3, OP-159 m.3 (t)
      - alert: AccessHybridKexFailures
        expr: >-
          sum(increase(access_tls_handshakes_total{group="x25519mlkem768",outcome="failed"}[1h]))
          / clamp_min(sum(increase(access_tls_handshakes_total{group="x25519mlkem768"}[1h])), 1)
          > 0.005
        labels:
          severity: ticket
          runbook: hybrid-kex-failures
        annotations:
          summary: More than 0.5% of post-quantum key exchange handshakes failed in the last hour
          description: >-
            Clients that offered the X25519MLKEM768 key share failed their TLS handshake ten
            times more often than the measured middlebox breakage. A realm with affected clients
            can move them to the advertise-only key share policy; the post-quantum group is
            never dropped.
