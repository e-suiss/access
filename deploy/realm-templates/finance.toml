# Realm template `finance` (OP-153 m.3 (r), §10.9.2): realm policy defaults as data.
# `access-cli realm apply-template` commits each step as its own Exercise and stops at the
# first failure.

name = "finance"
description = "Banking and finance: passkeys, MFA required, short sessions bound to the address."

[[step]]
resource = "settings/signin-policy"

[step.body]
methods = ["passkey"]
required_fields = ["email", "phone_number"]
mfa_required = true

[[step]]
resource = "settings/session-policy"

[step.body]
absolute_ms = 1800000
idle_ms = 300000
binding = "ip"
