# Realm template `health` (OP-153 m.3 (r), §10.9.2): realm policy defaults as data.
# `access-cli realm apply-template` commits each step as its own Exercise and stops at the
# first failure.

name = "health"
description = "Health data: passkeys and e-mail, MFA required, short sessions."

[[step]]
resource = "settings/signin-policy"

[step.body]
methods = ["passkey", "email"]
required_fields = ["email"]
mfa_required = true

[[step]]
resource = "settings/session-policy"

[step.body]
absolute_ms = 3600000
idle_ms = 600000
binding = "ip"
