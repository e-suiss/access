# Realm template `public` (OP-153 m.3 (r), §10.9.2): realm policy defaults as data.
# `access-cli realm apply-template` commits each step as its own Exercise and stops at the
# first failure.

name = "public"
description = "Public sector services: passkeys and e-mail, MFA required, sessions bound to the network."

[[step]]
resource = "settings/signin-policy"

[step.body]
methods = ["passkey", "email"]
required_fields = ["email"]
mfa_required = true

[[step]]
resource = "settings/session-policy"

[step.body]
absolute_ms = 7200000
idle_ms = 900000
binding = "asn"
