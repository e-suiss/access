# OP-69, OP-149 m.4, m.21: the bootstrap with the Work platform client. Mount a directory with
# Work's public keys at /etc/access/products and point ACCESS_BOOTSTRAP_PLAN here.
platform = "platform"
tenants = ["acme"]
issuer_style = "path"

# OP-149 m.10: acme's Genesis publishes the Work catalog with this action, and its root grants it
# to a sample subject; the bootstrap prints what an eligibility check names as `sample`.
# OP-149 m.29 (b): `allowed` is a second action of the catalog (CT1; parameters `ledger`, a
# text, and `declaration`, a digest) that the root grants to the test user's Party under an
# approval requirement, with the Grant to contribute that approval; the bootstrap prints what
# an Exercise of it names as `test_user.allowed`, and `access-local-client approve` runs one
# through the hosted Approval Surface. The catalog is a Genesis fact: changing `allowed` on an
# existing realm needs a fresh volume.
# OP-149 m.30 (a): the allowed Grant covers the resources of `resource_namespace` whose first
# path element starts with `resource_path_prefix` (Work E-45 item 5); the summary reports both
# as `test_user.allowed.resource`, and an intent names `{namespace, path: ["led_…"]}`.
# OP-149 m.33 (c): with `step_up`, the allowed Grant also asks for the test user's fresh AAL2
# authentication bound to their device Instance (§13.7.3 CT1: phishing-resistant, within 15
# minutes), so the first commit leaves an `authentication` term unmet beside the approval
# (Work's `next: step_up`) and the one passkey assertion on the Approval Surface meets both;
# the summary says `test_user.allowed.step_up`, and the approval's redirect carries the Claim
# the product passes back as `claim_ref`. The only level is "aal2". The Grant is derived from
# its bounds, so an existing realm gets a second Grant when this changes (OP-73).
[sample]
realm = "acme"
namespace = "work"
action = "approve"
allowed = "commit"
resource_namespace = "work.ledger"
resource_path_prefix = "led_"
step_up = "aal2"

# OP-149 m.26 (b), (e): a test user in acme with a password (AAL1), a software passkey (AAL2;
# its key is `access/bootstrap/test-user-passkey` in the server's token, beside the device key
# `access/bootstrap/test-user-device`) and a public client (PKCE and DPoP, no secret) a
# headless login signs in with; `access-local-client login` runs that flow with either factor,
# naming Work's client_id as `--resource` to get a token whose `aud` is Work (OP-149 m.26 (a)).
# The password comes from the environment variable named here, never from this file:
#   ACCESS_LOCAL_TEST_PASSWORD=... docker compose -f deploy/compose/access.yaml up -d
# The bootstrap prints the user as `test_user` (identifier, subject, client_id, redirect_uri,
# party, instance, passkey, allowed).
# Without a local mirror of the breach ranges (`breach_ranges_dir`) the password is not checked
# against one; the bootstrap says so.
[test_user]
realm = "acme"
identifier = "test@acme.example"
password_env = "BOOTSTRAP_TEST_PASSWORD"
client_display_name = "Local test client"
redirect_uri = "http://127.0.0.1/cb"

# OP-149 m.26 (c): acme accepts unsigned `party_compromise` Claims from a local declarant Party,
# so Work's PEP can hand one to `POST /access/v1/claims:ingest` with its PEP certificate and
# receive `party.compromised` on its stream. The bootstrap prints the declarant as
# `compromise.issuer`; `access-local-client compromise` sends the Claim.
# The other local event producers (OP-149 m.26 (c)):
#   access-server client-update <this plan> work "Suiss Work (renamed)"   -> api_client.updated
#   access-server client-retire <this plan> work                          -> api_client.disabled
#   access-local-client stream-status ... --status paused                 -> the stream's status
# A retired client is gone for good; the next bootstrap run registers a new one.
[compromise]
realm = "acme"

[[products]]
product = "work"
display_name = "Suiss Work"
# P-256 JWK: the key Work's client assertions (RFC 7523) are signed with
client_key = "/etc/access/products/work-client.jwk"
# Ed25519 or P-256 JWK: Work's service Instance key, signing its pairing Exercises
service_key = "/etc/access/products/work-service.jwk"
# OP-149 m.19 (c), m.23: Access opens one SSF push stream (RFC 8935) to this URL on the first
# pairing. On the local network it is a private address on port 8443, so the server must declare
# exactly this URL, with the local CA, and init must issue work-server's certificate:
#   ACCESS_LOCAL_PRODUCT_HOSTS=work-server
#   ACCESS_DELIVERY_TARGETS='[{url="https://work-server:8443/v1/inbound/events", ca_file="/var/lib/access/certs/ca.crt"}]'
# Without the declaration the bootstrap refuses it (invalid-event-receiver).
# event_receiver = "https://work-server:8443/v1/inbound/events"
# OP-149 m.33 (d), m.35: the product's return addresses. The Approval Surface of every realm
# accepts a pushed request's redirect_uri exactly when it is one of these (RFC 6749 §3.1.2);
# the product is registered once, here in the platform realm, and tenant realms need no
# registration of their own. Each address is https, or http on the loopback host (RFC 8252).
# An older plan's single `redirect_uri = "..."` is still read as a list of one; a plan names
# one of the two keys. The summary lists them as `clients[].redirect_uris`.
redirect_uris = ["https://work.localhost/v1/access/approval", "http://127.0.0.1:8190/v1/access/approval"]
