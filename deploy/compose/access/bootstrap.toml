# OP-69, OP-149 m.21: what `access-server bootstrap` makes sure of. Every realm gets a path
# issuer under https://access-server:8443/realms/<slug>.
platform = "platform"
tenants = ["acme"]
issuer_style = "path"

# OP-149 m.10: acme's Genesis publishes the Work catalog with this action, and its root grants it
# to a sample subject; the bootstrap prints what an eligibility check names as `sample`.
# OP-149 m.29 (b): `allowed` is a second action of the catalog (CT1; parameters `ledger`, a
# text, and `declaration`, a digest) that the root grants to the test user's Party under an
# approval requirement, with the Grant to contribute that approval; the bootstrap prints what
# an Exercise of it names as `test_user.allowed`, and `access-local-client approve` runs one
# through the hosted Approval Surface. The catalog is a Genesis fact: changing `allowed` on an
# existing realm needs a fresh volume.
# OP-149 m.30 (a): the allowed Grant covers the resources of `resource_namespace` whose first
# path element starts with `resource_path_prefix` (Work E-45 item 5); the summary reports both
# as `test_user.allowed.resource`, and an intent names `{namespace, path: ["led_…"]}`.
[sample]
realm = "acme"
namespace = "work"
action = "approve"
allowed = "commit"
resource_namespace = "work.ledger"
resource_path_prefix = "led_"

# OP-149 m.26 (b), (e): a test user in acme with a password (AAL1), a software passkey (AAL2;
# its key is `access/bootstrap/test-user-passkey` in the server's token, beside the device key
# `access/bootstrap/test-user-device`) and a public client (PKCE and DPoP, no secret) a
# headless login signs in with; `access-local-client login` runs that flow with either factor.
# The password comes from the environment variable named here, never from this file:
#   ACCESS_LOCAL_TEST_PASSWORD=... docker compose -f deploy/compose/access.yaml up -d
# The bootstrap prints the user as `test_user` (identifier, subject, client_id, redirect_uri,
# party, instance, passkey, allowed).
# Without a local mirror of the breach ranges (`breach_ranges_dir`) the password is not checked
# against one; the bootstrap says so.
# With `totp_seed_file` the user also has an authenticator app (RFC 6238: SHA-1, 6 digits, 30 s),
# enrolled through the realm's own TOTP enrollment with a seed the realm draws at random; the
# seed is written to that file in base32, owner-only, and never printed. A browser test signs in
# with the password and a code from it. The summary says `test_user.totp` (seed_file, algorithm,
# digits, period).
[test_user]
realm = "acme"
identifier = "test@acme.example"
password_env = "BOOTSTRAP_TEST_PASSWORD"
client_display_name = "Local test client"
redirect_uri = "http://127.0.0.1/cb"
totp_seed_file = "/var/lib/access/bootstrap/test-user-totp"

# OP-149 m.26 (c): acme accepts unsigned `party_compromise` Claims from a local declarant Party,
# so a product's PEP can hand one to `POST /access/v1/claims:ingest` with its PEP certificate and
# receive `party.compromised`. The bootstrap prints the declarant as `compromise.issuer`;
# `access-local-client compromise` sends the Claim.
[compromise]
realm = "acme"

# OP-154 m.15 (i): a sample agent in acme, operated by the realm's root, with the test user as
# its sponsor. Its key (`access/bootstrap/sample-agent`) signs its own `party_register` and the
# root signs `idp.agent.register`; its runtime key (`access/bootstrap/sample-agent-runtime`)
# opens one Instance under the test user's account; the test user's device issues it a Grant of
# the sample action for the test user, and it makes one allowed Exercise of it. No executor runs
# here, so nothing reports that Exercise's outcome. The summary says `sample_agent` (party,
# operator, instance, basis, exercise). Leave the section out for a realm without an agent.
[sample_agent]
realm = "acme"
display_name = "Local sample agent"

# OP-157 m.6 (i): a support operator in acme, a member of its support organization, with the
# realm's registered case system and an open case of the test user, so a support request can be
# made; the operator signs in with the test user's password (this deployment's own, not a
# secret). Its device key (`access/bootstrap/support-operator-device`) is its Party's, and the
# case system's key (`access/bootstrap/support-case-system`) signs the `support_case` Claim,
# which holds for a week and is stated again by a later day's run. The summary says
# `support_operator` (identifier, subject, party, organisation, case_system, case, acceptance).
[support_operator]
realm = "acme"
display_name = "Mehmet Y."
organisation = "Acme Support"
identifier = "support@acme.example"
password_env = "BOOTSTRAP_TEST_PASSWORD"
case_system = "local-desk"
case = "4411"

# OP-157 m.6 (i), m.10: a break-glass account in acme, owner of its own organization and marked
# by `idp.org.member_breakglass`; it has no password and signs in only with a hardware passkey.
# It and the test user each hold a pre-issued break-glass Grant (`idp.account:mfa_change`, two
# approvals from distinct Parties), and the test user may review break-glass uses. The summary
# says `breakglass_account` (identifier, subject, party, organisation, grants).
[breakglass_account]
realm = "acme"
identifier = "oncall@acme.example"
organisation = "Acme Security"

# OP-157 m.6 (i): an access review over the managers' teams; the test user manages the sample
# agent's Grant, so its campaign shows one item, and the console offers it the screen. The
# summary says `review_schedule` (name, period_days, manager, items).
[review_schedule]
realm = "acme"
name = "local-review"
period_days = 90

# OP-159 m.4 (a): the sample realm's post-quantum signing profile, opened by its own
# `idp.realm.signing_profile` and `idp.realm.kex_share` Exercises; the Signing screen's `@live`
# spec reads it. The summary says `pq_profile` (realm, profile, kex_share).
[pq_profile]
realm = "acme"
profile = "ml-dsa-65"
kex_share = "optimistic"
