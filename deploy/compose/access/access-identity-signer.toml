# OP-69, CMP-22b: the identity signer in the local deployment; its token is its own.
socket = "/run/access/identity-signer.sock"
vault = "/var/lib/access/identity-signer"
callers = [65532]
# CR-34, OP-158 m.3 (y): a signer runs paranoid; the local VM kernel may lack memfd_secret, so
# the local deployment names mlock (the container grants the memlock limit)
hardening = "paranoid"
secret_memory = "mlock"
# OP-150: the identity audit log origin is "<cell>/identity-audit"
cell = "local"

[hsm]
module = "/usr/lib/softhsm/libsofthsm2.so"
token = "access-identity-signer"
pin_file = "/var/lib/access/secrets/hsm-access-identity-signer"
kek = "access/identity-signer/kek"
paths = ["/var/lib/softhsm/tokens"]
