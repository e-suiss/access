# OP-69, CMP-22a: the authority signer in the local deployment.
socket = "/run/access/signer.sock"
vault = "/var/lib/access/signer"
callers = [65532]
# CR-34, OP-158 m.3 (y): a signer runs paranoid; the local VM kernel may lack memfd_secret, so
# the local deployment names mlock (the container grants the memlock limit)
hardening = "paranoid"
secret_memory = "mlock"

[hsm]
module = "/usr/lib/softhsm/libsofthsm2.so"
token = "access-signer"
pin_file = "/var/lib/access/secrets/hsm-access-signer"
kek = "access/signer/kek"
paths = ["/var/lib/softhsm/tokens"]

# CR-29, OP-157 m.3 (x): the local software quorum the init container runs
[ceremony]
transcript = "/var/lib/access/signer/ceremony.transcript"
genesis_file = "/var/lib/access/secrets/signer-ceremony-genesis"
