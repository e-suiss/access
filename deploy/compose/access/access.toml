# OP-69, OP-149 m.21: access-server in the local deployment (deploy/compose/access.yaml).
# Paths are the volumes access-local-init fills; secrets are files, never environment variables.
listen = "0.0.0.0:8443"
# OP-151 m.3 (b): the management API and console, and the health endpoints, on their own ports
management_listen = "0.0.0.0:9443"
internal_listen = "0.0.0.0:9090"
issuer = "https://access-server:8443"
# OP-143 m.5
signer = "/run/access/signer.sock"

[tls]
cert_file = "/var/lib/access/certs/access-server.crt"
key_file = "/var/lib/access/secrets/access-server.key"
# OP-141 m.18 (b), OP-149 m.15 (h): PEP client certificates from the local CA
client_ca_file = "/var/lib/access/certs/ca.crt"

# OP-141 m.18 (g), OP-55
[database]
host = "postgres"
port = 5432
name = "access"
root_cert_file = "/var/lib/access/certs/ca.crt"
durability = "single-node"
sequencer = { user = "access_sequencer_login", password_file = "/var/lib/access/secrets/db-sequencer", pool = 2 }
app = { user = "access_app_login", password_file = "/var/lib/access/secrets/db-app", pool = 4 }
deriver = { user = "access_deriver_login", password_file = "/var/lib/access/secrets/db-deriver", pool = 1 }
router = { user = "access_router_login", password_file = "/var/lib/access/secrets/db-router", pool = 2 }
archive = { user = "access_archive_login", password_file = "/var/lib/access/secrets/db-archive", pool = 1 }
outbox_reader = { user = "access_outbox_reader_login", password_file = "/var/lib/access/secrets/db-outbox-reader", pool = 1 }
checkpointer = { user = "access_checkpointer_login", password_file = "/var/lib/access/secrets/db-checkpointer", pool = 1 }
migrator = { user = "access_migrator_login", password_file = "/var/lib/access/secrets/db-migrator", pool = 1 }

# TN-10, CMP-22b, OP-138
[identity]
realm_base = "https://access-server:8443"
signer = "/run/access/identity-signer.sock"

# OP-146 m.12 (f): the hosted login's built app, from the image
[login]
dist_dir = "/usr/share/access/login"

# TN-128: the console's built app, from the image
[console]
dist_dir = "/usr/share/access/console"

# OP-153 m.3 (w): the account pages' built app, from the image
[account]
dist_dir = "/usr/share/access/account"

# OP-149 m.3, m.15 (g)
[suiss]
region = "local"
relay = "https://relay:8443"
management_api = "https://access-server.local:9443"
products = { work = "https://work:8443" }
# OP-151 m.2 M2: the platform realm the bootstrap creates governs the platform-admin surface
platform_realm = "platform"
# OP-156 m.3 (c): the platform product name Relay's client is registered under; only it reports İYS states
relay_product = "relay"
# E42, OP-156 m.3 (c): Access as Relay's platform tenant; init writes the credential
[suiss.relay_platform]
tenant = "access"
credential_file = "/var/lib/access/secrets/relay-credential"
ca_file = "/var/lib/access/certs/ca.crt"

# SI-13, CR-22, CR-30, OP-150: SoftHSM has no quota; one token store serves every local domain
[provider]
kms_shared = false
hsm_partition_shared = true

# OP-94, OP-141 m.18 (h), OP-69
[hsm]
module = "/usr/lib/softhsm/libsofthsm2.so"
token = "access-server"
pin_file = "/var/lib/access/secrets/hsm-access-server"
paths = ["/var/lib/softhsm/tokens"]
