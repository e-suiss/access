# OP-69, OP-149 m.22, TI-9, OP-49, RAUTHY-008, §14.3: a real Access for products to test against.
# Same binaries and checks as production; SoftHSM is the local PKCS#11 token and a local CA
# issues every certificate. Nothing here is a development mode.
#
#   ACCESS_LOCAL_TEST_PASSWORD=... docker compose -f deploy/compose/access.yaml up -d
#   docker compose -f deploy/compose/access.yaml run --rm bootstrap   # print the ids again
#   docker compose -f deploy/compose/access.yaml run --rm local-client login ...   # a real sign-in

name: access-local

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-access: &access
  <<: *hardening
  image: ${ACCESS_IMAGE:-ghcr.io/e-suiss/access:local}
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp:uid=65532,gid=65532

services:
  # Fresh named volumes are root-owned, or take the owner of whichever container mounts them
  # first; this sets their owners before anything writes to them.
  volume-owners:
    <<: *hardening
    image: ${ACCESS_IMAGE:-ghcr.io/e-suiss/access:local}
    user: "0:0"
    cap_add: [CHOWN, FOWNER]
    read_only: true
    entrypoint: ["sh", "-c"]
    command:
      - >-
        chown 65532:65532 /var/lib/access/certs /var/lib/access/secrets /var/lib/access/initdb
        /var/lib/access/signer /var/lib/access/identity-signer /var/lib/access/bootstrap
        /var/lib/access/product-tls &&
        chmod 0750 /var/lib/access/certs /var/lib/access/secrets /var/lib/access/initdb
        /var/lib/access/signer /var/lib/access/identity-signer /var/lib/access/bootstrap
        /var/lib/access/product-tls &&
        chown 65532:softhsm /var/lib/softhsm/tokens && chmod 0770 /var/lib/softhsm/tokens
    volumes:
      - certs:/var/lib/access/certs
      - secrets:/var/lib/access/secrets
      - initdb:/var/lib/access/initdb
      - softhsm:/var/lib/softhsm/tokens
      - signer:/var/lib/access/signer
      - identity-signer:/var/lib/access/identity-signer
      - bootstrap:/var/lib/access/bootstrap
      - product-tls:/var/lib/access/product-tls

  # OP-69, CR-28: certificates, credentials, tokens and KEKs, once. OP-149 m.23: with
  # ACCESS_LOCAL_PRODUCT_HOSTS="work-server ...", a server certificate per product host in the
  # product-tls volume (mount it read-only in the product, as uid or group 65532). OP-141 m.18 (b):
  # a PEP client certificate <name>.crt there for each <name>.csr in ACCESS_PRODUCT_KEYS.
  init:
    <<: *access
    command: ["access-local-init"]
    environment:
      ACCESS_LOCAL_PRODUCT_HOSTS: ${ACCESS_LOCAL_PRODUCT_HOSTS:-}
    depends_on:
      volume-owners:
        condition: service_completed_successfully
    volumes:
      - product-tls:/var/lib/access/product-tls
      - ${ACCESS_PRODUCT_KEYS:-./access/products}:/etc/access/products:ro
      - certs:/var/lib/access/certs
      - secrets:/var/lib/access/secrets
      - initdb:/var/lib/access/initdb
      - softhsm:/var/lib/softhsm/tokens
      - signer:/var/lib/access/signer
      - identity-signer:/var/lib/access/identity-signer

  # OP-7, T8, OP-73, OP-130 m.10: TLS only, SCRAM logins, one per role
  postgres:
    <<: *hardening
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
    user: "999:999"
    group_add: ["65532"]
    read_only: true
    entrypoint:
      - sh
      - -c
      - >-
        install -m 0600 /docker-entrypoint-initdb.d/postgres.key /var/run/postgresql/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_min_protocol_version=TLSv1.3
        -c ssl_cert_file=/var/lib/access/certs/postgres.crt
        -c ssl_key_file=/var/run/postgresql/server.key
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999
      - /tmp:uid=999,gid=999
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /docker-entrypoint-initdb.d/superuser
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
    volumes:
      - pgdata:/var/lib/postgresql
      - certs:/var/lib/access/certs:ro
      - initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "access"]
      interval: 2s
      timeout: 3s
      retries: 60

  # OP-55: schema migrations as the migration role; a second run applies nothing
  migrate:
    <<: *access
    command: ["access-server", "migrate"]
    environment:
      ACCESS_CONFIG: /etc/access/local/access.toml
    volumes:
      - certs:/var/lib/access/certs:ro
      - secrets:/var/lib/access/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  # CMP-22a
  signer:
    <<: *access
    command: ["access-signer"]
    restart: unless-stopped
    environment:
      ACCESS_SIGNER_CONFIG: /etc/access/local/access-signer.toml
    # CR-34
    ulimits:
      memlock:
        soft: 1048576
        hard: 1048576
    volumes:
      - secrets:/var/lib/access/secrets:ro
      - softhsm:/var/lib/softhsm/tokens
      - signer:/var/lib/access/signer
      - sockets:/run/access
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/run/access/signer.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

  # CMP-22b
  identity-signer:
    <<: *access
    command: ["access-identity-signer"]
    restart: unless-stopped
    environment:
      ACCESS_IDENTITY_SIGNER_CONFIG: /etc/access/local/access-identity-signer.toml
    # CR-34
    ulimits:
      memlock:
        soft: 1048576
        hard: 1048576
    volumes:
      - secrets:/var/lib/access/secrets:ro
      - softhsm:/var/lib/softhsm/tokens
      - identity-signer:/var/lib/access/identity-signer
      - sockets:/run/access
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/run/access/identity-signer.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OP-149 m.21, m.26: the platform tenant, sample tenants, product clients and the test fixtures
  # (test user, compromise declarant); prints their ids and keeps them in the bootstrap volume
  # (bootstrap.json). The same service runs the one-shot client changes:
  #   docker compose -f deploy/compose/access.yaml run --rm bootstrap \
  #     access-server client-update /etc/access/local/bootstrap-work.toml work "Suiss Work 2"
  bootstrap:
    <<: *access
    entrypoint: ["sh", "-c"]
    command:
      - >-
        access-server bootstrap "$${BOOTSTRAP_PLAN}" > /var/lib/access/bootstrap/bootstrap.json &&
        cat /var/lib/access/bootstrap/bootstrap.json
    environment:
      ACCESS_CONFIG: /etc/access/local/access.toml
      # OP-149 m.23: a suiss_event_receiver on this network must be declared
      ACCESS_DELIVERY_TARGETS: ${ACCESS_DELIVERY_TARGETS:-[]}
      # not ACCESS_*: that prefix is the server configuration
      BOOTSTRAP_PLAN: ${ACCESS_BOOTSTRAP_PLAN:-/etc/access/local/bootstrap.toml}
      # OP-149 m.26 (b), TI-9: the test user's password, chosen by you; there is no default
      BOOTSTRAP_TEST_PASSWORD: ${ACCESS_LOCAL_TEST_PASSWORD:?set ACCESS_LOCAL_TEST_PASSWORD, the password of the bootstrap's test user}
    volumes:
      - certs:/var/lib/access/certs:ro
      - secrets:/var/lib/access/secrets:ro
      - softhsm:/var/lib/softhsm/tokens
      - sockets:/run/access
      - bootstrap:/var/lib/access/bootstrap
      - ${ACCESS_PRODUCT_KEYS:-./access/products}:/etc/access/products:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      signer:
        condition: service_healthy
      identity-signer:
        condition: service_healthy

  access-server:
    <<: *access
    command: ["access-server"]
    restart: unless-stopped
    environment:
      ACCESS_CONFIG: /etc/access/local/access.toml
      # OP-149 m.23, TI-9: empty unless a product declares where it receives pushed events, e.g.
      # [{url="https://work-server:8443/v1/inbound/events", ca_file="/var/lib/access/certs/ca.crt"}]
      ACCESS_DELIVERY_TARGETS: ${ACCESS_DELIVERY_TARGETS:-[]}
    volumes:
      - certs:/var/lib/access/certs:ro
      - secrets:/var/lib/access/secrets:ro
      - softhsm:/var/lib/softhsm/tokens
      - sockets:/run/access
    ports:
      - "127.0.0.1:${ACCESS_PORT:-8443}:8443"
      # OP-151 m.3 (b), CMP-15.5: the management API on its own port
      - "127.0.0.1:${ACCESS_ADMIN_PORT:-9443}:9443"
    # OP-151 m.12 (b): the management origin is a registrable host name, so every realm gets the
    # console's client; on the host, map access-server.local to 127.0.0.1 to use the console
    networks:
      default:
        aliases: [access-server.local]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # OP-67 m.3, OP-151 m.3 (b): readiness on the internal listener, never on the public one
      test: ["CMD", "curl", "-fsS", "--cacert", "/var/lib/access/certs/ca.crt", "https://localhost:9090/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OP-149 m.26 (b), (c), (e), m.29 (b): the headless client, on demand (`profiles: [tools]`),
  # with the local CA, the PEP certificate, bootstrap.json and the server's token (the test
  # user's device key and software passkey live there; the keys never leave it) in reach:
  #   docker compose -f deploy/compose/access.yaml run --rm local-client login \
  #     --issuer https://access-server:8443/realms/acme --ca /var/lib/access/certs/ca.crt \
  #     --client-id <test_user.client_id> --redirect-uri http://127.0.0.1/cb \
  #     --identifier test@acme.example --password-env BOOTSTRAP_TEST_PASSWORD [--resource <client_id>]
  #   ... login ... --passkey access/bootstrap/test-user-passkey --hsm-module /usr/lib/softhsm/libsofthsm2.so \
  #     --hsm-token access-server --hsm-pin-file /var/lib/access/secrets/hsm-access-server
  #   ... login ... --passkey ... --device-key access/bootstrap/test-user-device   # binds the session to the device Instance
  #   docker compose -f deploy/compose/access.yaml run --rm local-client approve ...   # see the README
  #   docker compose -f deploy/compose/access.yaml run --rm local-client compromise \
  #     --api https://access-server:8443 --ca /var/lib/access/certs/ca.crt \
  #     --cert /var/lib/access/certs/pep.crt --key /var/lib/access/certs/pep.key \
  #     --domain <compromise.domain> --issuer-party <compromise.issuer> --party <a Party>
  local-client:
    <<: *access
    profiles: ["tools"]
    entrypoint: ["access-local-client"]
    environment:
      BOOTSTRAP_TEST_PASSWORD: ${ACCESS_LOCAL_TEST_PASSWORD:-}
    volumes:
      - certs:/var/lib/access/certs:ro
      - secrets:/var/lib/access/secrets:ro
      - softhsm:/var/lib/softhsm/tokens
      - bootstrap:/var/lib/access/bootstrap:ro
      - product-tls:/var/lib/access/product-tls:ro
      - ${ACCESS_PRODUCT_KEYS:-./access/products}:/etc/access/products:ro
    depends_on:
      access-server:
        condition: service_healthy

networks:
  default:
    name: access-local

volumes:
  certs:
  secrets:
  initdb:
  pgdata:
  softhsm:
  signer:
  identity-signer:
  sockets:
  bootstrap:
  product-tls:
