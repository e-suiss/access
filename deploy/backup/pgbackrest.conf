# OP-57, §17.10.3, OP-158 m.3 (r): the cell's backups. Full, differential and incremental backups,
# continuous WAL archive for point-in-time recovery, every repository encrypted, two repositories
# (local and object store), and the integrity check of each (`pgbackrest verify`). A logical dump
# is never the only strategy. The cipher passphrases come from the secret store as
# PGBACKREST_REPO1_CIPHER_PASS and PGBACKREST_REPO2_CIPHER_PASS, never from this file; the object
# store's credentials the same way.
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-bundle=y
repo1-block=y

repo2-type=s3
repo2-path=/access-cell
repo2-s3-bucket=access-cell-backup
repo2-s3-endpoint=s3.example.invalid
repo2-s3-region=eu-central-1
repo2-s3-key-type=web-id
repo2-cipher-type=aes-256-cbc
repo2-retention-full=8
repo2-bundle=y
repo2-block=y

archive-async=y
archive-push-queue-max=16GiB
spool-path=/var/spool/pgbackrest
start-fast=y
process-max=4
compress-type=zst
delta=y
log-level-console=info

[access-cell]
pg1-path=/var/lib/postgresql/18/main
