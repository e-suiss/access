# U54, SA-25: the kernel arguments of a dedicated node (/etc/default/grub.d/99-access.cfg); the
# provisioning labels the node access.suiss.dev/kernel-mitigations=auto-nosmt once it booted
# with them and taints it access.suiss.dev/dedicated=true:NoSchedule
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mitigations=auto,nosmt"
