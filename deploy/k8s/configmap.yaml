# OP-63 rule 4, CR-12, OP-129 m.3: process settings only; no secret lives here
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-server
  labels:
    app.kubernetes.io/name: access-server
data:
  access.toml: |
    listen = "0.0.0.0:8443"
    # OP-151 m.3 (b): the management API and console, and the health endpoints, on their own ports
    management_listen = "0.0.0.0:9443"
    internal_listen = "0.0.0.0:9090"
    issuer = "https://access-server.access.svc"

    [tls]
    cert_file = "/run/tls/tls.crt"
    key_file = "/run/tls/tls.key"
    client_ca_file = "/run/tls/ca.crt"

    # OP-141 m.18 (g)
    [database]
    host = "access-db.access-db.svc"
    port = 5432
    name = "access"
    root_cert_file = "/run/tls/ca.crt"
    durability = "replicated"
    sequencer = { user = "access_sequencer_login", password_file = "/run/secrets/db-sequencer", pool = 8 }
    app = { user = "access_app_login", password_file = "/run/secrets/db-app", pool = 16 }
    deriver = { user = "access_deriver_login", password_file = "/run/secrets/db-deriver", pool = 2 }
    router = { user = "access_router_login", password_file = "/run/secrets/db-router", pool = 4 }
    # OP-146 m.5 (f), OP-131
    archive = { user = "access_archive_login", password_file = "/run/secrets/db-archive", pool = 1 }
    outbox_reader = { user = "access_outbox_reader_login", password_file = "/run/secrets/db-outbox-reader", pool = 2 }

    # TN-10, CMP-22b, OP-138
    [identity]
    realm_base = "https://id.access.example"
    signer = "/run/access/identity-signer.sock"

    # OP-149 m.3, m.4
    [suiss]
    region = "eu-central"
    relay = "https://relay.access.example"
    management_api = "https://api.access.example"
    products = { work = "https://work.access.example" }
    # OP-151 m.2 M2: the platform tenant realm governs the platform-admin surface
    platform_realm = "platform"

    # OP-94, OP-141 m.18 (h)
    [hsm]
    module = "/opt/pkcs11/module.so"
    token = "access"
    pin_file = "/run/secrets/hsm-pin"
  # OP-55, OP-138: the migration job's configuration, the database and its migration login only
  migrate.toml: |
    [database]
    host = "access-db.access-db.svc"
    port = 5432
    name = "access"
    root_cert_file = "/run/tls/ca.crt"
    durability = "replicated"
    migrator = { user = "access_migrator_login", password_file = "/run/secrets/db-migrator", pool = 1 }
