# CR-35, OP-129 m.3, OP-158 m.3 (y): every secret a pod reads is a file the Secrets Store CSI
# driver writes into tmpfs; no environment value and no Secret object holds one. The provider
# reads OpenBao with the pod's own workload identity: OpenBao's jwt auth method at
# `auth/spiffe` trusts SPIRE's OIDC discovery for the audience `openbao`, so the identity
# SPIRE gives the pod's service account (spiffe://<trust domain>/ns/access/sa/<name>) is what
# opens the role; the file interface the processes read is the same as on a local host.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: access-server
  labels:
    app.kubernetes.io/name: access-server
spec:
  provider: vault
  parameters:
    vaultAddress: https://openbao.openbao.svc:8200
    vaultCACertPath: /run/tls/ca.crt
    vaultAuthMountPath: spiffe
    roleName: access-server
    audience: openbao
    objects: |
      - objectName: db-sequencer
        secretPath: access/data/database/sequencer
        secretKey: password
      - objectName: db-app
        secretPath: access/data/database/app
        secretKey: password
      - objectName: db-deriver
        secretPath: access/data/database/deriver
        secretKey: password
      - objectName: db-router
        secretPath: access/data/database/router
        secretKey: password
      - objectName: db-archive
        secretPath: access/data/database/archive
        secretKey: password
      - objectName: db-outbox-reader
        secretPath: access/data/database/outbox-reader
        secretKey: password
      - objectName: db-checkpointer
        secretPath: access/data/database/checkpointer
        secretKey: password
      - objectName: hsm-pin
        secretPath: access/data/hsm/server
        secretKey: pin
      - objectName: hsm-signer-pin
        secretPath: access/data/hsm/signer
        secretKey: pin
      - objectName: hsm-identity-signer-pin
        secretPath: access/data/hsm/identity-signer
        secretKey: pin
      - objectName: signer-ceremony-genesis
        secretPath: access/data/signer/ceremony
        secretKey: genesis
      - objectName: relay-credential
        secretPath: access/data/relay/platform
        secretKey: credential
---
# OP-55: the migration job reads its migration login only
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: access-migrate
  labels:
    app.kubernetes.io/name: access-migrate
spec:
  provider: vault
  parameters:
    vaultAddress: https://openbao.openbao.svc:8200
    vaultCACertPath: /run/tls/ca.crt
    vaultAuthMountPath: spiffe
    roleName: access-migrate
    audience: openbao
    objects: |
      - objectName: db-migrator
        secretPath: access/data/database/migrator
        secretKey: password
