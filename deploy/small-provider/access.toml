# HL-40, OP-48, T8, T36, OP-158 m.3 (p): access-server in the small-provider profile: one node, one
# PostgreSQL, one PKCS#11 token, the two signers as their own processes. Secrets are files, never
# environment variables. Replace every example.org name before the first start.
listen = "0.0.0.0:8443"
# OP-151 m.3 (b): the management API and console, and the health endpoints, on their own ports
management_listen = "0.0.0.0:9443"
internal_listen = "0.0.0.0:9090"
issuer = "https://access.example.org"
# OP-143 m.5
signer = "/run/access/signer.sock"

[tls]
cert_file = "/etc/access/tls/server.crt"
key_file = "/etc/access/tls/server.key"
# OP-141 m.18 (b), OP-149 m.15 (h): PEP client certificates from the local CA
client_ca_file = "/etc/access/tls/ca.crt"

# OP-141 m.18 (g), OP-55
[database]
host = "127.0.0.1"
port = 5432
name = "access"
root_cert_file = "/etc/access/tls/ca.crt"
durability = "single-node"
sequencer = { user = "access_sequencer_login", password_file = "/etc/access/secrets/db-sequencer", pool = 2 }
app = { user = "access_app_login", password_file = "/etc/access/secrets/db-app", pool = 4 }
deriver = { user = "access_deriver_login", password_file = "/etc/access/secrets/db-deriver", pool = 1 }
router = { user = "access_router_login", password_file = "/etc/access/secrets/db-router", pool = 2 }
archive = { user = "access_archive_login", password_file = "/etc/access/secrets/db-archive", pool = 1 }
outbox_reader = { user = "access_outbox_reader_login", password_file = "/etc/access/secrets/db-outbox-reader", pool = 1 }
checkpointer = { user = "access_checkpointer_login", password_file = "/etc/access/secrets/db-checkpointer", pool = 1 }
migrator = { user = "access_migrator_login", password_file = "/etc/access/secrets/db-migrator", pool = 1 }

# TN-10, CMP-22b, OP-138
[identity]
realm_base = "https://id.example.org"
signer = "/run/access/identity-signer.sock"

# OP-146 m.12 (f): the hosted login's built app, from the image
[login]
dist_dir = "/usr/share/access/login"

# TN-128: the console's built app, from the image
[console]
dist_dir = "/usr/share/access/console"

# OP-153 m.3 (w): the account pages' built app, from the image
[account]
dist_dir = "/usr/share/access/account"

# OP-149 m.3, m.15 (g)
[suiss]
region = "small-provider"
relay = "https://relay.example.org"
management_api = "https://manage.example.org"
products = { work = "https://work.example.org" }
# OP-151 m.2 M2: the platform realm the bootstrap creates governs the platform-admin surface
platform_realm = "platform"
# OP-156 m.3 (c): the platform product name Relay's client is registered under; only it reports İYS states
relay_product = "relay"
# E42, OP-156 m.3 (c): Access as Relay's platform tenant; init writes the credential
[suiss.relay_platform]
tenant = "access"
credential_file = "/etc/access/secrets/relay-credential"
ca_file = "/etc/access/tls/ca.crt"

# SI-13, CR-22, CR-30, OP-150: SoftHSM has no quota; one token store serves every local domain
[provider]
kms_shared = false
hsm_partition_shared = true

# OP-94, OP-141 m.18 (h), OP-69
[hsm]
module = "/usr/lib/softhsm/libsofthsm2.so"
token = "access-server"
pin_file = "/etc/access/secrets/hsm-access-server"
paths = ["/var/lib/softhsm/tokens"]

# HL-40, OP-158 m.3 (o), (p): one cell, this node; every domain it leads publishes
# `durability: single-node` and this region
[cells]
this = "small-provider"

[[cells.cell]]
name = "small-provider"
region = "eu-central"
class = "regional"
