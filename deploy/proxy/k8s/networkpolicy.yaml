# IDP-30 (3): the applications behind the proxy should accept traffic from these pods only; give
# each application namespace a policy that admits app.kubernetes.io/name=access-proxy and nothing
# else, or Access refuses plain identity headers for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: https
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Access's mTLS listener
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: access
      ports:
        - port: 8443
          protocol: TCP
    # the applications
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
